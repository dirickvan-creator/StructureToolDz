<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StructuraDZ Pro v5.1 — Plan Editor · BAEL91 · RPA 2024</title>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" onerror="window.__fail_katex=1"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--bg4:#e2e8f0;
  --txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;
  --line:#e2e8f0;--line2:#cbd5e1;
  --pri:#2563eb;--pri2:#1d4ed8;--pri-bg:#dbeafe;
  --ok:#059669;--ok-bg:#d1fae5;--warn:#d97706;--warn-bg:#fef3c7;
  --err:#dc2626;--err-bg:#fee2e2;--acad:#7c3aed;--acad-bg:#ede9fe;
  --math-bg:#f0f9ff;--math-border:#bae6fd;
  --mono:"JetBrains Mono","Consolas",monospace;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}
body.dark{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--bg4:#475569;
  --txt:#f1f5f9;--txt2:#cbd5e1;--txt3:#94a3b8;
  --line:#334155;--line2:#475569;
  --pri-bg:#1e3a8a;--ok-bg:#064e3b;--warn-bg:#78350f;--err-bg:#7f1d1d;
  --acad-bg:#4c1d95;--math-bg:#1e3a8a;--math-border:#3b82f6;
}
html,body{height:100%}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}

.nav{background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.nav-top{padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:38px;height:38px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;font-family:Cambria,serif}
.brand-text h1{font-size:14.5px;font-weight:700}
.brand-text p{font-size:10.5px;color:var(--txt3)}
.nav-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mode-switch{display:inline-flex;background:var(--bg3);border-radius:7px;padding:3px;gap:2px}
.mode-switch button{padding:5px 10px;border-radius:5px;font-size:11px;font-weight:600;color:var(--txt2)}
.mode-switch button.active{background:var(--pri);color:#fff}
.theme-btn{width:32px;height:32px;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:15px}

.nav-globals{padding:8px 18px 10px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.ng-item label{display:block;font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.ng-item select{width:100%;padding:5px 7px;background:var(--bg3);border:1px solid var(--line);border-radius:5px;color:var(--txt);font-size:11px}

.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 110px)}
@media(max-width:880px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--bg2);border-right:1px solid var(--line);padding:10px 6px 40px;overflow-y:auto;position:sticky;top:110px;height:calc(100vh - 110px)}
.sidebar-group{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;padding:10px 8px 3px}
.sidebar-group:first-child{padding-top:0}
.sb-btn{display:block;width:100%;text-align:left;padding:6px 10px;font-size:11.5px;font-weight:500;color:var(--txt2);border-radius:5px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-btn:hover{background:var(--bg3);color:var(--txt)}
.sb-btn.active{background:var(--pri-bg);color:var(--pri);font-weight:600}
.sb-btn.sb-pri{color:var(--pri);font-weight:700}

.main{padding:18px 22px 130px;max-width:1450px;margin:0 auto;width:100%}
.view-h{font-size:17px;font-weight:700;margin-bottom:2px}
.view-sub{color:var(--txt3);font-size:11.5px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-h::before{content:"";width:3px;height:13px;background:var(--pri);border-radius:2px}

.eq-card{background:var(--math-bg);border:1px solid var(--math-border);border-radius:8px;padding:14px 18px;margin-bottom:14px;overflow-x:auto}
.eq-card .eq-title{font-size:10px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.eq-card .eq-body{display:flex;justify-content:center;align-items:center;padding:6px 0;min-height:2.4em}
.eq-card .katex{color:var(--pri);font-size:1.15em}
.eq-card .legend{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--txt2);line-height:1.7}
.eq-card .legend .v{font-family:var(--mono);color:var(--pri);font-weight:600}
.eq-card .ref{margin-top:6px;font-size:10.5px;color:var(--txt3);font-style:italic}
body.dark .eq-card .katex{color:#93c5fd}

.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px;margin-bottom:11px}
.inp{display:flex;flex-direction:column;gap:2px}
.inp label{font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px}
.inp input,.inp select{padding:6px 9px;background:var(--bg3);border:1px solid var(--line);border-radius:5px;color:var(--txt);font-size:12px;font-family:var(--mono);width:100%}
.inp input:focus,.inp select:focus{outline:none;border-color:var(--pri);background:var(--bg2)}
.inp input.err{border-color:var(--err);background:var(--err-bg)}

.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri2)}
.btn-out{background:var(--bg3);color:var(--txt2);border-color:var(--line2)}
.btn-out:hover{background:var(--bg4);color:var(--txt)}
.btn-sm{padding:4px 9px;font-size:11px}

.result-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
@media(max-width:820px){.result-wrap{grid-template-columns:1fr}}
.result{background:var(--bg3);border-radius:7px;padding:11px 13px;font-size:11.5px}
.res-sec{font-size:9.5px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.5px;margin:11px 0 5px;padding-bottom:3px;border-bottom:1px dashed var(--line2)}
.res-sec:first-child{margin-top:0}
.res-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);gap:6px}
.res-row:last-child{border-bottom:none}
.res-row .rl{color:var(--txt2);font-size:11px}
.res-row .rv{font-family:var(--mono);font-weight:600;color:var(--pri);text-align:right;font-size:11px}
body.dark .res-row .rv{color:#93c5fd}

.err-banner{background:var(--err-bg);color:var(--err);border:1px solid var(--err);border-radius:5px;padding:9px 12px;font-size:11.5px;margin-bottom:9px}
.info-banner{background:var(--pri-bg);color:var(--pri);border:1px solid var(--pri);border-radius:5px;padding:9px 12px;font-size:11.5px;margin-bottom:9px}

.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;border:1px solid;margin:1px 1px 0 0}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.badge.bad{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.badge.info{background:var(--pri-bg);color:var(--pri);border-color:var(--pri)}

.diagram{background:#fafbfc;border:1px solid var(--line);border-radius:7px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;overflow:hidden}
body.dark .diagram{background:#0b1326}
.diagram svg{display:block;max-width:100%;height:auto}
.diag-cap{font-size:10px;color:var(--txt3);font-style:italic;margin-top:6px;text-align:center}

.academic-block{display:none;background:var(--acad-bg);border:1px solid var(--acad);border-radius:7px;padding:12px 16px;margin-top:11px;font-size:12px;line-height:1.8}
body.academic .academic-block{display:block}
.academic-block h4{font-size:11px;font-weight:700;color:var(--acad);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 5px}
.academic-block h4:first-child{margin-top:0}
.academic-block h4::before{content:"🎓 "}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:18px}
.dash-card{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.dash-card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.08);border-color:var(--pri)}
.dash-icon{width:30px;height:30px;background:var(--pri-bg);color:var(--pri);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:6px}
.dash-title{font-size:12px;font-weight:700;margin-bottom:2px}
.dash-desc{font-size:10.5px;color:var(--txt3);line-height:1.5}

.sticky-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:2px solid var(--pri);padding:9px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 -4px 20px rgba(0,0,0,.08);z-index:40;transform:translateY(100%);transition:transform .25s}
.sticky-bar.show{transform:translateY(0)}
.sticky-bar .sb-title{font-size:10.5px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sticky-bar .sb-val{font-size:15px;font-weight:700;color:var(--pri);font-family:var(--mono)}
.sticky-bar .sb-unit{font-size:10.5px;color:var(--txt3)}

.wizard-hero{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border-radius:11px;padding:28px;margin-bottom:18px}
.wizard-hero h2{font-size:22px;margin-bottom:6px}
.wizard-hero p{opacity:.9;font-size:12.5px;line-height:1.7}
.wizard-steps{display:flex;gap:6px;margin-bottom:16px}
.wizard-step{flex:1;height:5px;background:var(--bg3);border-radius:2px;overflow:hidden}
.wizard-step.done{background:var(--ok)}
.wizard-step.active{background:var(--pri)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--bg2);border-radius:11px;padding:18px;max-width:620px;width:100%;max-height:90vh;overflow:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:700}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:9px 16px;border-radius:7px;font-size:12px;opacity:0;transition:all .25s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

.muted{color:var(--txt3)}
.hidden{display:none!important}
.tbl{border-collapse:collapse;width:100%;font-size:11px}
.tbl th,.tbl td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.tbl th{background:var(--bg3);font-weight:700}
details summary{cursor:pointer;font-weight:600;font-size:11.5px;padding:4px 0}
details[open] summary{margin-bottom:6px}

#plan_canvas{background:#fafbfc;border-bottom:1px solid var(--line)}
body.dark #plan_canvas{background:#0b1326}
#plan_status{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bg3);font-size:11px;font-family:var(--mono);flex-wrap:wrap}
#plan_status span{white-space:nowrap}
#plan_status input{padding:2px 6px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:11px;color:var(--txt)}

@media print{
  .nav,.sidebar,.btn-row,.mode-switch,.theme-btn,.sticky-bar,.wizard-hero,.wizard-steps,#plan_status{display:none!important}
  .layout{display:block}
  .main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .result-wrap{grid-template-columns:1fr}
  body{font-size:10.5px}
}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-top">
    <div class="brand">
      <div class="brand-logo">DZ</div>
      <div class="brand-text">
        <h1>StructuraDZ Pro <span style="font-size:9px;background:var(--ok);color:#fff;padding:1px 5px;border-radius:3px;vertical-align:middle">v5.1</span></h1>
        <p>BAEL91 r.99 · RPA 99/2003 · RPA 2024 · DTR BC 2.2</p>
      </div>
    </div>
    <div class="nav-actions">
      <div class="mode-switch">
        <button data-mode="engineer" class="active">👷 Ingénieur</button>
        <button data-mode="academic">🎓 Académique</button>
      </div>
      <button class="theme-btn" id="themeBtn" title="Thème">🌙</button>
      <button class="btn btn-sm btn-out" onclick="UI.openWizard()">🧙 Assistant</button>
      <button class="btn btn-sm btn-out" onclick="UI.saveFile()">💾</button>
      <button class="btn btn-sm btn-out" onclick="UI.loadFile()">📂</button>
      <button class="btn btn-sm btn-out" onclick="UI.showTests()" title="Tests">✓</button>
    </div>
  </div>
  <div class="nav-globals">
    <div class="ng-item"><label>Code</label>
      <select id="gCode" onchange="UI.globalsChanged()"><option value="rpa2024">RPA 2024</option><option value="rpa2003">RPA 99 v2003</option></select>
    </div>
    <div class="ng-item"><label>Zone</label>
      <select id="gZone" onchange="UI.globalsChanged()">
        <option value="0">0</option><option value="I">I</option><option value="II">II</option>
        <option value="IIa">IIa</option><option value="IIb">IIb</option>
        <option value="III" selected>III</option><option value="IV">IV</option>
        <option value="V">V</option><option value="VI">VI</option>
      </select>
    </div>
    <div class="ng-item"><label>Site</label>
      <select id="gSite" onchange="UI.globalsChanged()">
        <option value="S1">S1 Rocheux</option><option value="S2" selected>S2 Ferme</option>
        <option value="S3">S3 Meuble</option><option value="S4">S4 Très meuble</option>
      </select>
    </div>
    <div class="ng-item"><label>Groupe</label>
      <select id="gGroup" onchange="UI.globalsChanged()">
        <option value="1A">1A (I=1.4)</option><option value="1B">1B (I=1.2)</option>
        <option value="2" selected>2 (I=1.0)</option><option value="3">3 (I=0.8)</option>
      </select>
    </div>
    <div class="ng-item"><label>Système</label>
      <select id="gSystem" onchange="UI.globalsChanged()">
        <option value="portiques">Portiques</option><option value="voiles">Voiles</option><option value="mixte" selected>Mixte</option>
      </select>
    </div>
    <div class="ng-item"><label>Ductilité</label>
      <select id="gDuct" onchange="UI.globalsChanged()">
        <option value="DCM">DCM</option><option value="DCH" selected>DCH</option>
      </select>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"><div class="muted">Chargement…</div></main>
</div>

<div class="sticky-bar" id="stickyBar">
  <span class="sb-title" id="sbTitle"></span>
  <span class="sb-val" id="sbVal"></span>
  <span class="sb-unit" id="sbUnit"></span>
  <span style="flex:1"></span>
  <span class="badge info" id="sbBadge">—</span>
</div>

<div class="toast" id="toast"></div>
<div id="modalHost"></div>

<!-- ═══════════════════════════════════════════════════════════════
     LAYER 1 — CORE: pure calculation functions, no DOM
     ═══════════════════════════════════════════════════════════════ -->
<script id="core">
"use strict";
const SDZ = (function(){
  const K = {
    ZONES_2024:{'0':0.04,'I':0.07,'II':0.10,'III':0.15,'IV':0.20,'V':0.25,'VI':0.30},
    I_GROUPS:{'1A':1.4,'1B':1.2,'2':1.0,'3':0.8},
    A2003:{'1A':{'0':0,'I':0.15,'IIa':0.25,'IIb':0.30,'III':0.40},
           '1B':{'0':0,'I':0.12,'IIa':0.20,'IIb':0.25,'III':0.30},
           '2':{'0':0,'I':0.10,'IIa':0.15,'IIb':0.20,'III':0.25},
           '3':{'0':0,'I':0.07,'IIa':0.10,'IIb':0.14,'III':0.18}},
    SITES_2024_T1:{S1:{S:1.00,TB:0.10,TC:0.40,TD:2.0},S2:{S:1.20,TB:0.10,TC:0.50,TD:2.0},
                    S3:{S:1.30,TB:0.15,TC:0.60,TD:2.0},S4:{S:1.35,TB:0.15,TC:0.70,TD:2.0}},
    SITES_2024_T2:{S1:{S:1.00,TB:0.05,TC:0.25,TD:1.20},S2:{S:1.30,TB:0.05,TC:0.30,TD:1.20},
                    S3:{S:1.55,TB:0.10,TC:0.40,TD:1.20},S4:{S:1.80,TB:0.10,TC:0.50,TD:1.20}},
    SITES_2003:{S1:{S:1.0,T1:0.15,T2:0.30},S2:{S:1.2,T1:0.15,T2:0.40},
                S3:{S:1.7,T1:0.15,T2:0.50},S4:{S:2.5,T1:0.15,T2:0.70}},
    GAMMA_B:1.5,GAMMA_S:1.15,THETA:1,
    PIG_ELU:[[0.4,0.109,0.004],[0.45,0.106,0.010],[0.5,0.100,0.019],[0.55,0.093,0.031],[0.6,0.084,0.045],[0.65,0.075,0.058],[0.7,0.066,0.070],[0.75,0.058,0.079],[0.8,0.051,0.087],[0.85,0.045,0.092],[0.9,0.040,0.096],[0.95,0.036,0.099],[1.0,0.033,0.100]],
    PSI_DEGRESSION:{1:1.0,2:1.0,3:0.95,4:0.90,5:0.85,6:0.80,7:0.75,8:0.71,9:0.68,10:0.66,11:0.65,12:0.63,13:0.62,14:0.61}
  };
  const M = {
    betaFromMu(mu){ if(mu<=0) return 1; const d=0.64-1.28*mu; if(d<0) return null; const a=(0.8-Math.sqrt(d))/0.64; return 1-0.4*a; },
    pigInterp(rho,table){ rho=Math.max(table[0][0],Math.min(rho,table[table.length-1][0]));
      for(let i=0;i<table.length-1;i++) if(rho>=table[i][0]&&rho<=table[i+1][0]){
        const u=(rho-table[i][0])/(table[i+1][0]-table[i][0]);
        return [table[i][1]+u*(table[i+1][1]-table[i][1]),table[i][2]+u*(table[i+1][2]-table[i][2])];
      } return [table[0][1],table[0][2]]; },
    BARS:(function(){const o=[];[8,10,12,14,16,20,25].forEach(d=>{for(let n=1;n<=8;n++)o.push({n,d,a:n*Math.PI*d*d/400});});return o;})(),
    pickBars(need,minD){ minD=minD||10; let b=null; M.BARS.forEach(x=>{if(x.d>=minD&&x.a>=need-1e-6&&(!b||x.a<b.a)) b=x;}); return b; },
    spacingFor(A,minD){ minD=minD||8; let b=null; [8,10,12,14,16,20].forEach(d=>{if(d<minD)return;
      [25,20,15,12.5,10].forEach(s=>{const a=Math.PI*d*d/400*(100/s);
        if(a>=A-1e-6&&(!b||a<b.a-1e-9||(Math.abs(a-b.a)<1e-9&&d<b.d))) b={d,s,a};});}); return b; },
    steelKg(d,len){ return Math.PI*d*d/4e6*7850*len; },
    jacobiEig(Ain){
      const n=Ain.length,A=Ain.map(r=>r.slice()),V=[];
      for(let i=0;i<n;i++){V.push(new Array(n).fill(0));V[i][i]=1;}
      for(let sw=0;sw<100;sw++){
        let off=0; for(let i=0;i<n;i++)for(let j=i+1;j<n;j++) off+=A[i][j]*A[i][j];
        if(off<1e-18) break;
        for(let p=0;p<n-1;p++)for(let q=p+1;q<n;q++){
          if(Math.abs(A[p][q])<1e-30) continue;

        const grp=i<n/3?0:(i<2*n/3?1:2), a=[c1,c2,c3][grp]/100;
        const I=Math.pow(a,4)/12;
        k.push(nc*12*E*I*crack/Math.pow(h,3)*wf);
      }
      const Kmat=[];for(let i=0;i<n;i++)Kmat.push(new Array(n).fill(0));
      for(let i=0;i<n;i++){Kmat[i][i]+=k[i];if(i+1<n){Kmat[i][i]+=k[i+1];Kmat[i][i+1]-=k[i+1];Kmat[i+1][i]-=k[i+1];}}
      const A=[];for(let i=0;i<n;i++){A.push([]);for(let j=0;j<n;j++)A[i].push(Kmat[i][j]/Math.sqrt(m[i]*m[j]));}
      const ev=M.jacobiEig(A), Mtotal=m.reduce((a,b)=>a+b,0), modes=[];
      for(let q=0;q<n;q++){
        const phi=ev.vecs[q].map((v,ii)=>v/Math.sqrt(m[ii]));
        let lm=0,mm=0;for(let i=0;i<n;i++){lm+=m[i]*phi[i];mm+=m[i]*phi[i]*phi[i];}
        const G=lm/mm, nf=Math.abs(phi[n-1])>1e-12?phi[n-1]:1, w=Math.sqrt(Math.max(ev.vals[q],1e-12));
        modes.push({w,T:2*Math.PI/w,phi,G,meff:lm*lm/mm/Mtotal,phiN:phi.map(v=>v/nf)});
      }
      let cum=0,nUse=0;
      for(let j=0;j<n;j++){cum+=modes[j].meff;if(!nUse&&cum>=0.9)nUse=j+1;}
      nUse=Math.max(nUse||n,Math.min(3,n));
      let cumUse=0;const perMode=[];
      for(let j=0;j<nUse;j++){
        const md=modes[j], Sa=spectrumSa(md.T,R,Q,xi)*9.81, F=[], Vs=new Array(n).fill(0), u=[];
        for(let i=0;i<n;i++){F.push(m[i]*md.G*md.phi[i]*Sa);u.push(md.G*md.phi[i]*Sa/(md.w*md.w));}
        for(let i=n-1;i>=0;i--)Vs[i]=(i<n-1?Vs[i+1]:0)+F[i];
        perMode.push({T:md.T,Sa,V:Vs,u});cumUse+=md.meff;
      }
      const Vst=new Array(n).fill(0),us=new Array(n).fill(0);
      for(let i=0;i<n;i++){let sv=0,su=0;perMode.forEach(pm=>{sv+=pm.V[i]*pm.V[i];su+=pm.u[i]*pm.u[i];});
        Vst[i]=Math.sqrt(sv);us[i]=Math.sqrt(su);}
      const Vdyn=Vst[0], hN=n*h;
      const Temp=Math.min(0.05*Math.pow(hN,0.75),0.09*hN/Math.sqrt(D));
      const Tuse=Math.min(Math.max(Temp,modes[0].T<1.3*Temp?modes[0].T:1.3*Temp),1.3*Temp);
      const A_=(K.ZONES_2024[v.zone||'III']||0.15)*(K.I_GROUPS[v.group||'2']||1.0);
      const S_=K.SITES_2024_T2[v.site||'S2'], f_=2.5*Q/R;
      let Vcoef; if(Tuse<=S_.TB) Vcoef=2/3+(Tuse/S_.TB)*(f_-2/3);
      else if(Tuse<=S_.TC) Vcoef=f_; else if(Tuse<=S_.TD) Vcoef=f_*(S_.TC/Tuse);
      else Vcoef=f_*(S_.TC*S_.TD/(Tuse*Tuse));
      const Vstat=Math.max(Vcoef*A_*S_.S,0.2*A_)*W;
      const scale=Vdyn<0.8*Vstat?0.8*Vstat/Vdyn:1;
      const del=us.map(v=>v*R*scale), drift=del.map((v,ii)=>(v-(ii?del[ii-1]:0))/h);
      return {ok:true,data:{n,h,W,m,k,modes,nUse,cumUse,Vdyn,Vstat,Vd:Math.max(Vdyn,0.8*Vstat),
        scale,Temp,T1:modes[0].T,Tuse,del,drift,dmax:Math.max(...drift),lim,Vst:Vst.map(v=>v*scale),R}};
    },

      const qv=1.35*Gv+1.5*Q, qp=1.35*Gp+1.5*Q, L=Lh+Lp;
      const RA=(qv*Lh*(L-Lh/2)+qp*Lp*Lp/2)/L, RB=qv*Lh+qp*Lp-RA;
      let x,Mmax;
      if(RA/qv<=Lh){x=RA/qv;Mmax=RA*x-qv*x*x/2;}
      else{x=Lh+(RA-qv*Lh)/qp;const dx=x-Lh;Mmax=RA*x-qv*Lh*(Lh/2+dx)-qp*dx*dx/2;}
      const d=ep/100-cCov, fbc=0.85*fc28/1.5, sig=fe/1.15;
      /* FIX: parameter renamed Mval to avoid shadowing the outer M object */
      const st=Mval=>{const mu=Mval/(d*d*fbc*1000);const b=M.betaFromMu(mu);return b?Mval/(b*d*sig*1000)*1e4:NaN;};
      const Mt=0.85*Mmax, Ma=0.3*Mmax, At=st(Mt), Aa=st(Ma);

    {name:'Rejette fc28=10',fn:()=>!calc.materials({fc28:10,fe:400}).ok},
    {name:'β(μ=0.1) ≈ 0.930',fn:()=>Math.abs(M.betaFromMu(0.1)-0.930)<0.005},

    {name:'β(μ=0.5) = null',fn:()=>M.betaFromMu(0.5)===null},

    {name:'Descente n=1, S=10, G=5, Q=2',fn:()=>{const r=calc.loadDescent({S:10,G:5,Q:2,Gt:5,Qt:1,n:1,pp:0});return r.ok&&r.data.NsBase>50&&r.data.NsBase<100;}},

    {name:'Poutre μ=0.1 simple armée',fn:()=>{const r=calc.beam({Mu:80,Ms:60,Vu:50,b:25,h:35,c:3,fc28:25,fe:400});return r.ok&&!r.data.dbl&&r.data.Ast>0;}},
    {name:'Poutre Mu=0 rejeté',fn:()=>!calc.beam({Mu:0,b:25,h:35,fc28:25,fe:400}).ok},
    {name:'Escalier Blondel h=17,g=30 → 64',fn:()=>{const r=calc.stair({H:3.06,hm:17,g:30,Lp:1.5,ep:15,Grev:1.8,Q:2.5,c:2.5,fc28:25,fe:400});return r.ok&&Math.abs(r.data.blondel-64)<2;}},
    {name:'Colonne λ et α calculés',fn:()=>{const r=calc.column({Nu:1200,Mu:180,b:45,h:45,c:3,l0:3.06,fc28:25,fe:400,code:'rpa2024',zone:'III',duct:'DCH'});return r.ok&&r.data.lambda>0&&r.data.alpha>0;}},
    {name:'Modal T1>0, M_eff≥0.9',fn:()=>{const r=calc.modal({n:5,h:3,W:10000,nc:20,c1:50,c2:45,c3:40,fc28:25,crack:0.5,wf:1,R:3.5,Q:1,xi:7,D:15,lim:1,code:'rpa2024',zone:'III',site:'S2',group:'2'});return r.ok&&r.data.T1>0&&r.data.cumUse>=0.9;}},

    {name:'Pigeaud valide (fix M shadowing)',fn:()=>{const r=calc.pigeaud({Lx:1.55,Ly:1.70,ep:15,c:2,G:5.29,Q:2.5,fc28:25,fe:400});return r.ok&&r.data.Ax>0;}},
    {name:'Escalier valide (fix fc28)',fn:()=>{const r=calc.stair({H:3.06,hm:17,g:30,Lp:1.5,ep:15,Grev:1.8,Q:2.5,c:2.5,fc28:25,fe:400});return r.ok;}},

  function runTests(){const out=[];tests.forEach(t=>{try{out.push({name:t.name,pass:!!t.fn()});}catch(e){out.push({name:t.name,pass:false,err:e.message});}});return out;}

  return {K,M,H,calc,modules,validate,runTests,tests};
})();

<script id="diagrams">
"use strict";
const C = {line:'#64748b',muted:'#94a3b8',accent:'#2563eb',rebar:'#dc2626',
           conc:'#e2e8f0',soil:'#a16207',water:'#0284c7',load:'#ea580c',
           ok:'#059669',err:'#dc2626',dim:'#64748b',hatch:'#a5b4fc'};
function svg(w,h,c){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="display:block;width:100%;max-width:${w}px;height:auto">${c}</svg>`;}
const D = {
  dimH(x1,x2,y,label){
    const m=(x1+x2)/2;
    return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${C.dim}"/>`+
      `<line x1="${x1}" y1="${y-3}" x2="${x1}" y2="${y+3}" stroke="${C.dim}"/>`+
      `<line x1="${x2}" y1="${y-3}" x2="${x2}" y2="${y+3}" stroke="${C.dim}"/>`+
      `<text x="${m}" y="${y-5}" text-anchor="middle" font-size="9" fill="${C.dim}" font-family="monospace">${label}</text>`;
  },
  dimV(x,y1,y2,label){
    const m=(y1+y2)/2;
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${C.dim}"/>`+
      `<line x1="${x-3}" y1="${y1}" x2="${x+3}" y2="${y1}" stroke="${C.dim}"/>`+
      `<line x1="${x-3}" y1="${y2}" x2="${x+3}" y2="${y2}" stroke="${C.dim}"/>`+
      `<text x="${x+4}" y="${m+3}" font-size="9" fill="${C.dim}" font-family="monospace">${label}</text>`;
  },
  loadArrow(x,y1,y2,label){
    const mid=(y1+y2)/2;
    return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-4}" stroke="${C.load}" stroke-width="1.5"/>`+

  stressStrain(d){
    const W=440,H=280, l=55,r=25,t=30,b=50, pw=W-l-r, ph=H-t-b;
    const fbc=d.fbc, epsBC=3.5, epsC0=2.0;
    const xs=e=>l+(e/epsBC)*pw, ys=s=>t+ph-(s/(fbc*1.2))*ph;
    let s='';
    for(let i=0;i<=7;i++){const x=l+(i/7)*pw;s+=`<line x1="${x}" y1="${t}" x2="${x}" y2="${t+ph}" stroke="#eef2f7"/>`;
      s+=`<text x="${x}" y="${t+ph+16}" text-anchor="middle" font-size="9" fill="${C.muted}">${((i/7)*epsBC).toFixed(1)}</text>`;}
    for(let i=0;i<=5;i++){const y=t+(i/5)*ph;s+=`<line x1="${l}" y1="${y}" x2="${l+pw}" y2="${y}" stroke="#eef2f7"/>`;
      s+=`<text x="${l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="${C.muted}">${((fbc*1.2)*(1-i/5)).toFixed(0)}</text>`;}
    let path='';
    for(let i=0;i<=20;i++){
      const e=(i/20)*epsC0, sig=fbc*(1-Math.pow(1-e/epsC0,2));
      path+=(i===0?'M':'L')+xs(e).toFixed(1)+','+ys(sig).toFixed(1);
    }
    path+=`L${xs(epsBC).toFixed(1)},${ys(fbc).toFixed(1)}`;
    s+=`<path d="${path}" fill="none" stroke="${C.accent}" stroke-width="2.5"/>`;
    s+=`<line x1="${l}" y1="${t+ph}" x2="${xs(epsC0).toFixed(1)}" y2="${ys(fbc).toFixed(1)}" stroke="${C.rebar}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>`;
    s+=`<line x1="${xs(epsBC).toFixed(1)}" y1="${t}" x2="${xs(epsBC).toFixed(1)}" y2="${t+ph}" stroke="${C.muted}" stroke-dasharray="2,2"/>`;
    s+=`<line x1="${l}" y1="${ys(fbc).toFixed(1)}" x2="${l+pw}" y2="${ys(fbc).toFixed(1)}" stroke="${C.rebar}" stroke-dasharray="4,3" opacity="0.5"/>`;
    s+=D.axes(l,t+ph,'ε (‰)','σ (MPa)');
    s+=`<line x1="${l}" y1="${t+ph}" x2="${l+pw}" y2="${t+ph}" stroke="${C.line}" stroke-width="1.5"/>`;
    s+=`<line x1="${l}" y1="${t}" x2="${l}" y2="${t+ph}" stroke="${C.line}" stroke-width="1.5"/>`;
    s+=`<circle cx="${xs(epsBC).toFixed(1)}" cy="${ys(fbc).toFixed(1)}" r="4" fill="${C.rebar}"/>`;
    s+=`<text x="${xs(epsBC)-6}" y="${ys(fbc)-8}" font-size="9.5" fill="${C.rebar}" text-anchor="end">ε_bc = 3.5‰</text>`;
    s+=`<text x="${xs(epsBC)+5}" y="${ys(fbc)-8}" font-size="9.5" fill="${C.accent}" font-weight="700">f_bc = ${fbc.toFixed(1)} MPa</text>`;
    s+=`<circle cx="${xs(epsC0).toFixed(1)}" cy="${ys(fbc).toFixed(1)}" r="3" fill="${C.accent}"/>`;
    s+=`<text x="${xs(epsC0)+5}" y="${ys(fbc)+12}" font-size="9" fill="${C.accent}">ε_c0 = 2‰</text>`;
    s+=`<text x="${W/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="${C.line}" font-style="italic">Diagramme contrainte-déformation — BAEL91 A.4.3.4</text>`;

  building(d){

  beam(d){

    s+=D.supportTri(beamX+4,beamY+beamH);
    s+=D.supportTri(beamX+L-4,beamY+beamH);
    for(let i=1;i<8;i++) s+=D.loadArrow(beamX+i*L/8, beamY-25, beamY-2, i===4?`q_u`:null);

    s+=`<line x1="${beamX}" y1="${mY}" x2="${beamX+L}" y2="${mY}" stroke="${C.line}"/>`;
    let mpath='';
    for(let i=0;i<=30;i++){
      const t=i/30, M=4*t*(1-t)*d.Mutil;

    s+=`<path d="${mpath}" fill="${C.accent}22" stroke="${C.accent}" stroke-width="1.8"/>`;

    s+=`<text x="${beamX+L/2+3}" y="${mY-d.Mutil/mH*40+4}" font-size="9" fill="${C.rebar}" font-family="monospace">${d.Mutil.toFixed(1)}</text>`;
    const sY=mY+mH+15;
    s+=`<text x="${beamX}" y="${sY-8}" font-size="10" fill="${C.line}" font-weight="600">V(x) [kN]</text>`;
    s+=`<line x1="${beamX}" y1="${sY+15}" x2="${beamX+L}" y2="${sY+15}" stroke="${C.line}"/>`;
    if(d.tau>0){

      s+=`<line x1="${beamX}" y1="${sY-5}" x2="${beamX+L}" y2="${sY+15}" stroke="${C.accent}" stroke-width="1.5"/>`;

    s+=`<rect x="${secX}" y="${secY}" width="${sw}" height="${sh}" fill="${C.conc}" stroke="${C.line}" stroke-width="1.5"/>`;
    const nBars=Math.min(4,Math.round(d.Ast/3));

    s+=D.dimV(secX-8,secY,secY+sh,`h=${d.h}`);
    s+=D.dimH(secX,secX+sw,secY+sh+14,`b=${d.b}`);

  footing(d){
    const W=360,H=360,pad=30;

    const pw=d.A*100*ps, pd=d.B*100*ps, px=(W-pw)/2, py=20;

    s+=`<rect x="${px}" y="${py}" width="${pw}" height="${pd}" fill="#dbeafe" stroke="${C.accent}" stroke-width="1.8"/>`;
    s+=`<rect x="${ax}" y="${ay}" width="${aw}" height="${ad}" fill="${C.conc}" stroke="${C.line}" stroke-width="1.5"/>`;

      s+=`<text x="${x0+a/2}" y="${y0+b+14}" text-anchor="middle" font-size="9" fill="${C.rebar}" font-family="monospace">porte ${d.w}m</text>`;
    }
    s+=D.dimH(x0,x0+a,y0+b+32,`a=${d.a}m`);
    s+=D.dimV(x0+b+15,y0,y0+b,`b=${d.b}m`);
    s+=`<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="${C.line}" font-style="italic">Noyau t=${d.t}cm · J_o/J_f=${(d.ratio*100).toFixed(1)}%</text>`;
    return svg(W,H,s);
  }
};
</script>

<!-- ═══════════════════════════════════════════════════════════════
     LAYER 3 — UI + PLAN EDITOR
     ═══════════════════════════════════════════════════════════════ -->
<script id="ui">
"use strict";
const UI = (function(){
  const SS = SDZ.M;
  const state = {
    view:'wizard', mode:'engineer', theme:'light',
    lastResults:{},
    project:{name:'Projet sans titre',author:'',data:{},globals:{code:'rpa2024',zone:'III',site:'S2',group:'2',system:'mixte',duct:'DCH'},plan:null},
    wizard:{step:0,v:{name:'Nouveau projet',type:'logement',n:8,code:'rpa2024',zone:'III',site:'S2',group:'2',system:'mixte',lx:4.5,ly:4.5,nx:4,ny:3,h:3.06,fc28:25,fe:400,ss:0.20}}
  };
  const LS_KEY = 'structuradz_v51';
  const PLAN_W=900, PLAN_H=620, PLAN_PAD=60;
  const planUI = {
    mode:'select', zoom:1, panX:0, panY:0,
    snapSize:0.10, ortho:false,
    selection:null, hover:null, drag:null,
    cursor:{x:0,y:0,snappedX:false,snappedY:false},
    undo:[], redo:[]
  };

  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function globals(){ return {
    code:(document.getElementById('gCode')||{}).value||'rpa2024',
    zone:(document.getElementById('gZone')||{}).value||'III',
    site:(document.getElementById('gSite')||{}).value||'S2',
    group:(document.getElementById('gGroup')||{}).value||'2',
    system:(document.getElementById('gSystem')||{}).value||'mixte',
    duct:(document.getElementById('gDuct')||{}).value||'DCH'
  }; }
  function globalsChanged(){
    state.project.globals = globals(); scheduleSave();
    if(state.view!=='wizard'&&state.view!=='dashboard'&&state.view!=='plan'){
      const id=state.view; renderView(); setTimeout(()=>runCalc(id),30);
    }
  }

  /* ═════ PLAN DATA ═════ */
  function defaultColB(){ return parseInt((document.getElementById('md_c1')||{}).value)||45; }
  function buildPlanFromWizard(v){
    const nx=Math.max(1,Math.round(v.nx||4)), ny=Math.max(1,Math.round(v.ny||3));
    const lx=+v.lx||4.5, ly=+v.ly||4.0;
    const gridX=[],gridY=[];
    for(let i=0;i<=nx;i++) gridX.push(+(i*lx).toFixed(2));
    for(let j=0;j<=ny;j++) gridY.push(+(j*ly).toFixed(2));
    return {gridX,gridY,columns:{},columnSections:{},walls:[],slabVoids:[],
            storyHeight:+(v.h||3.06),nStories:Math.max(1,Math.round(v.n||8))+1};
  }
  function isColActive(i,j){ const c=state.project.plan.columns||{}; return !(c[i]&&c[i][j]===false); }
  function colLabel(i,j){ return String.fromCharCode(65+i)+(j+1); }
  function planEnsure(){
    if(!state.project.plan) state.project.plan = buildPlanFromWizard(state.wizard.v);
    const p = state.project.plan;
    if(!p.columns) p.columns={};
    if(!p.columnSections) p.columnSections={};
    if(!p.walls) p.walls=[];
    if(!p.slabVoids) p.slabVoids=[];
    if(!p.storyHeight) p.storyHeight=3.06;
    if(!p.nStories) p.nStories=9;
  }
  function rerenderPlanEditor(){ scheduleSave(); if(state.view==='plan') renderPlanEditor(); }

  /* ═════ GRID EDITORS ═════ */
  function planSetX(i,val){ const x=parseFloat(val); if(!isFinite(x)) return;
    state.project.plan.gridX[i]=x; state.project.plan.gridX.sort((a,b)=>a-b); rerenderPlanEditor(); }
  function planSetY(j,val){ const y=parseFloat(val); if(!isFinite(y)) return;
    state.project.plan.gridY[j]=y; state.project.plan.gridY.sort((a,b)=>a-b); rerenderPlanEditor(); }
  function planAddX(){ const g=state.project.plan.gridX;
    const step=g.length>1?g[g.length-1]-g[g.length-2]:4.5;
    g.push(+(g[g.length-1]+step).toFixed(2)); rerenderPlanEditor(); }
  function planAddY(){ const g=state.project.plan.gridY;
    const step=g.length>1?g[g.length-1]-g[g.length-2]:4.0;
    g.push(+(g[g.length-1]+step).toFixed(2)); rerenderPlanEditor(); }
  function planRemoveX(){ const g=state.project.plan.gridX;
    if(g.length<=2) return toast('Minimum 2 axes X'); g.pop(); rerenderPlanEditor(); }
  function planRemoveY(){ const g=state.project.plan.gridY;
    if(g.length<=2) return toast('Minimum 2 axes Y'); g.pop(); rerenderPlanEditor(); }
  function planAutoDistributeX(){ const g=state.project.plan.gridX;
    if(g.length<2) return; const a=g[0],b=g[g.length-1],st=(b-a)/(g.length-1);
    for(let i=0;i<g.length;i++) g[i]=+(a+i*st).toFixed(2); rerenderPlanEditor(); }
  function planAutoDistributeY(){ const g=state.project.plan.gridY;
    if(g.length<2) return; const a=g[0],b=g[g.length-1],st=(b-a)/(g.length-1);
    for(let i=0;i<g.length;i++) g[i]=+(a+i*st).toFixed(2); rerenderPlanEditor(); }
  function planBatchX(){ const el=document.getElementById('plan_x_batch'); if(!el) return;
    const arr=el.value.split(/[,\s;]+/).map(parseFloat).filter(isFinite).sort((a,b)=>a-b);
    if(arr.length<2) return toast('Au moins 2 valeurs X');
    planPushUndo();
    state.project.plan.gridX=arr.map(v=>+v.toFixed(2)); el.value='';
    rerenderPlanEditor(); toast(arr.length+' axes X importés'); }
  function planBatchY(){ const el=document.getElementById('plan_y_batch'); if(!el) return;
    const arr=el.value.split(/[,\s;]+/).map(parseFloat).filter(isFinite).sort((a,b)=>a-b);
    if(arr.length<2) return toast('Au moins 2 valeurs Y');
    planPushUndo();
    state.project.plan.gridY=arr.map(v=>+v.toFixed(2)); el.value='';
    rerenderPlanEditor(); toast(arr.length+' axes Y importés'); }
  function planToggleColumn(i,j){ const p=state.project.plan;
    if(!p.columns) p.columns={};
    if(!p.columns[i]) p.columns[i]={};
    if(p.columns[i][j]===false){ p.columns[i][j]=true; if(p.columnSections) delete p.columnSections[`${i},${j}`]; }
    else p.columns[i][j]=false;
    rerenderPlanEditor(); }
  function planAllColumns(active){ const p=state.project.plan, nx=p.gridX.length, ny=p.gridY.length;
    planPushUndo();
    p.columns={}; if(!active){ for(let i=0;i<nx;i++){ p.columns[i]={};
      for(let j=0;j<ny;j++) p.columns[i][j]=false; } } rerenderPlanEditor(); }
  function planInvertColumns(){ const p=state.project.plan, nx=p.gridX.length, ny=p.gridY.length;
    planPushUndo();
    const cur=p.columns||{}, next={};
    for(let i=0;i<nx;i++){ next[i]={}; for(let j=0;j<ny;j++){
      const wasActive=!(cur[i]&&cur[i][j]===false); next[i][j]=!wasActive; } }
    p.columns=next; rerenderPlanEditor(); }
  function planSetColSection(key,prop,val){ const p=state.project.plan;
    if(!p.columnSections) p.columnSections={};
    if(!p.columnSections[key]) p.columnSections[key]={b:defaultColB(),h:defaultColB()};
    p.columnSections[key][prop]=parseFloat(val)||defaultColB(); rerenderPlanEditor(); }
  function planRemoveColSection(key){ delete state.project.plan.columnSections[key]; rerenderPlanEditor(); }
  function planAddColSection(){ const key=(document.getElementById('plan_ov_col')||{}).value;
    const b=parseFloat((document.getElementById('plan_ov_b')||{}).value);
    const h=parseFloat((document.getElementById('plan_ov_h')||{}).value);
    if(!key||!isFinite(b)||!isFinite(h)) return;
    planPushUndo();
    state.project.plan.columnSections[key]={b,h}; rerenderPlanEditor(); }
  function planAddWall(){ const p=state.project.plan, gx=p.gridX, gy=p.gridY;
    if(!p.walls) p.walls=[];
    planPushUndo();
    p.walls.push({x1:gx[0],y1:gy[0],x2:gx[0],y2:gy[gy.length-1],t:20,kind:'voile'});
    rerenderPlanEditor(); }
  function planAddNoyau(){ const p=state.project.plan, gx=p.gridX, gy=p.gridY;
    if(!p.walls) p.walls=[];
    const cx=(gx[0]+gx[gx.length-1])/2, cy=(gy[0]+gy[gy.length-1])/2, w=2.5, d=2.6;
    planPushUndo();
    [[cx-w/2,cy-d/2,cx+w/2,cy-d/2],[cx-w/2,cy+d/2,cx+w/2,cy+d/2],
     [cx-w/2,cy-d/2,cx-w/2,cy+d/2],[cx+w/2,cy-d/2,cx+w/2,cy+d/2]].forEach(s=>{
      p.walls.push({x1:+s[0].toFixed(2),y1:+s[1].toFixed(2),x2:+s[2].toFixed(2),y2:+s[3].toFixed(2),t:20,kind:'noyau'}); });
    rerenderPlanEditor(); }
  function planRemoveWall(i){ planPushUndo(); state.project.plan.walls.splice(i,1); rerenderPlanEditor(); }
  function planSetWall(i,key,val){ if(key==='kind') state.project.plan.walls[i].kind=val;
    else state.project.plan.walls[i][key]=parseFloat(val)||0; rerenderPlanEditor(); }
  function planResetFromWizard(){ planPushUndo();
    state.project.plan=buildPlanFromWizard(state.wizard.v);
    rerenderPlanEditor(); toast('Grille régulière régénérée'); }

  /* ═════ UNDO / REDO ═════ */
  function planPushUndo(){
    planUI.undo.push(JSON.stringify(state.project.plan));
    if(planUI.undo.length>60) planUI.undo.shift();
    planUI.redo=[];
  }
  function planUndo(){
    if(!planUI.undo.length) return toast('Rien à annuler');
    planUI.redo.push(JSON.stringify(state.project.plan));
    state.project.plan=JSON.parse(planUI.undo.pop());
    rerenderPlanEditor(); toast('Annulé');
  }
  function planRedo(){
    if(!planUI.redo.length) return toast('Rien à rétablir');
    planUI.undo.push(JSON.stringify(state.project.plan));
    state.project.plan=JSON.parse(planUI.redo.pop());
    rerenderPlanEditor(); toast('Rétabli');
  }

  /* ═════ TRANSFORM & SNAP ═════ */
  function planTF(){
    const p=state.project.plan;
    const xmin=p.gridX[0], xmax=p.gridX[p.gridX.length-1];
    const ymin=p.gridY[0], ymax=p.gridY[p.gridY.length-1];
    const sB=Math.min((PLAN_W-2*PLAN_PAD)/Math.max(xmax-xmin,1),(PLAN_H-2*PLAN_PAD)/Math.max(ymax-ymin,1));
    const scale=sB*planUI.zoom;
    const cx=PLAN_W/2+planUI.panX, cy=PLAN_H/2+planUI.panY;
    const wx0=(xmin+xmax)/2, wy0=(ymin+ymax)/2;
    return {
      toScreen:(wx,wy)=>[cx+(wx-wx0)*scale, cy-(wy-wy0)*scale],
      toWorld:(sx,sy)=>[(sx-cx)/scale+wx0, -(sy-cy)/scale+wy0],
      scale
    };
  }
  function planSnap(wx,wy,from){
    const p=state.project.plan, S=planUI.snapSize;
    let bx=wx,by=wy,sx=false,sy=false;
    let dX=S*4; for(const gx of p.gridX){const d=Math.abs(wx-gx); if(d<dX){bx=gx;dX=d;sx=true;}}
    let dY=S*4; for(const gy of p.gridY){const d=Math.abs(wy-gy); if(d<dY){by=gy;dY=d;sy=true;}}
    if(from && planUI.ortho){
      const dx=wx-from.x, dy=wy-from.y, dist=Math.hypot(dx,dy);
      if(dist>0.2){
        const ang=Math.atan2(dy,dx);
        const sAng=Math.round(ang/(Math.PI/4))*(Math.PI/4);
        bx=from.x+Math.cos(sAng)*dist; by=from.y+Math.sin(sAng)*dist;
        sx=sy=true;
      }
    }
    if(!sx) bx=Math.round(wx/S)*S;
    if(!sy) by=Math.round(wy/S)*S;
    return {x:bx,y:by,snappedX:sx,snappedY:sy};
  }
  function _distSeg(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,L2=dx*dx+dy*dy;
    if(L2===0) return Math.hypot(px-x1,py-y1);
    let t=((px-x1)*dx+(py-y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
  }
  function planHit(sx,sy,tf){
    const p=state.project.plan, cols=p.columns||{};
    for(let i=0;i<p.gridX.length;i++) for(let j=0;j<p.gridY.length;j++){
      if(cols[i]&&cols[i][j]===false) continue;
      const [px,py]=tf.toScreen(p.gridX[i],p.gridY[j]);
      if(Math.hypot(sx-px,sy-py)<14) return {type:'column',i,j};
    }
    for(let k=0;k<(p.walls||[]).length;k++){
      const w=p.walls[k];
      const [x1,y1]=tf.toScreen(w.x1,w.y1), [x2,y2]=tf.toScreen(w.x2,w.y2);
      if(_distSeg(sx,sy,x1,y1,x2,y2)<8) return {type:'wall',id:k};
    }
    return null;
  }
  function _canvasPos(e){
    const svg=document.getElementById('plan_svg'); if(!svg) return {sx:0,sy:0};
    const r=svg.getBoundingClientRect();
    return {sx:(e.clientX-r.left)*(PLAN_W/r.width), sy:(e.clientY-r.top)*(PLAN_H/r.height)};
  }

  /* ═════ CANVAS EVENTS ═════ */
  function onCanvasMouseDown(e){
    if(e.button!==0) return;
    const {sx,sy}=_canvasPos(e), tf=planTF();
    const [wx,wy]=tf.toWorld(sx,sy);
    const hit=planHit(sx,sy,tf);
    const m=planUI.mode;
    if(m==='select'){ planUI.selection=hit; renderPlanEditor(); return; }
    if(m==='addCol'){
      if(hit&&hit.type==='column'){ planPushUndo(); planToggleColumn(hit.i,hit.j); return; }
      const s=planSnap(wx,wy);
      let bi=-1,bj=-1,bd=1e9;
      const p=state.project.plan;
      for(let i=0;i<p.gridX.length;i++) for(let j=0;j<p.gridY.length;j++){
        const d=Math.hypot(p.gridX[i]-s.x,p.gridY[j]-s.y);
        if(d<bd){bd=d;bi=i;bj=j;}
      }
      if(bi>=0&&bd<1.5){ planPushUndo(); planToggleColumn(bi,bj); }
      return;
    }
    if(m==='drawWall'||m==='drawNoyau'){
      const s=planSnap(wx,wy);
      planUI.drag={type:m,start:s,current:s};
      updatePlanCanvas(); return;
    }
    if(m==='delete'){
      if(hit){ planPushUndo();
        if(hit.type==='wall'){ state.project.plan.walls.splice(hit.id,1); rerenderPlanEditor(); }
        else if(hit.type==='column'){ planToggleColumn(hit.i,hit.j); }
      }
    }
  }
  function onCanvasMouseMove(e){
    const {sx,sy}=_canvasPos(e), tf=planTF();
    const [wx,wy]=tf.toWorld(sx,sy);
    const from=planUI.drag?planUI.drag.start:null;
    const s=planSnap(wx,wy,from);
    planUI.cursor=s;
    if(planUI.drag){ planUI.drag.current=s; updatePlanCanvas(); updatePlanStatus(); }
    else {
      const h=planHit(sx,sy,tf);
      const prev=planUI.hover;
      const changed = (!prev&&h)||(prev&&!h)||(prev&&h&&(prev.type!==h.type||prev.i!==h.i||prev.j!==h.j||prev.id!==h.id));
      if(changed) planUI.hover=h;
      updatePlanCanvas(); updatePlanStatus();
    }
  }
  function onCanvasMouseUp(){
    if(!planUI.drag) return;
    const d=planUI.drag; planUI.drag=null;
    if(d.type==='drawWall'){
      const len=Math.hypot(d.current.x-d.start.x, d.current.y-d.start.y);
      if(len>=0.3){
        planPushUndo();
        state.project.plan.walls.push({x1:d.start.x,y1:d.start.y,x2:d.current.x,y2:d.current.y,t:20,kind:'voile'});
      }
    } else if(d.type==='drawNoyau'){
      const x1=Math.min(d.start.x,d.current.x), x2=Math.max(d.start.x,d.current.x);
      const y1=Math.min(d.start.y,d.current.y), y2=Math.max(d.start.y,d.current.y);
      if(x2-x1>0.5&&y2-y1>0.5){
        planPushUndo();
        state.project.plan.walls.push(
          {x1,y1,x2,y2,t:20,kind:'noyau'},
          {x1,y1:y2,x2,y2,t:20,kind:'noyau'},
          {x1,y1,x2:x1,y2,t:20,kind:'noyau'},
          {x1:x2,y1,x2,y2,t:20,kind:'noyau'}
        );
      }
    }
    rerenderPlanEditor();
  }
  function onCanvasWheel(e){
    e.preventDefault();
    const {sx,sy}=_canvasPos(e);
    const tf1=planTF(), [wx,wy]=tf1.toWorld(sx,sy);
    planUI.zoom=Math.max(0.3,Math.min(6,planUI.zoom*(e.deltaY>0?0.9:1.1)));
    const tf2=planTF(), [nx,ny]=tf2.toScreen(wx,wy);
    planUI.panX+=sx-nx; planUI.panY+=sy-ny;
    updatePlanCanvas(); updatePlanStatus();
  }
  function onCanvasMouseLeave(){ planUI.hover=null; updatePlanCanvas(); }

  /* ═════ TOOLBAR ACTIONS ═════ */
  function setPlanMode(m){ planUI.mode=m; planUI.selection=null; renderPlanEditor(); }
  function setPlanOrtho(v){ planUI.ortho=v; updatePlanCanvas(); }
  function setPlanSnap(v){ const x=parseFloat(v); if(isFinite(x)&&x>0) planUI.snapSize=x; updatePlanCanvas(); updatePlanStatus(); }
  function planUIFitView(){ planUI.zoom=1; planUI.panX=0; planUI.panY=0; updatePlanCanvas(); updatePlanStatus(); }
  function planDeleteSelected(){
    const s=planUI.selection; if(!s) return;
    planPushUndo();
    if(s.type==='column') planToggleColumn(s.i,s.j);
    else if(s.type==='wall'){ state.project.plan.walls.splice(s.id,1); }
    planUI.selection=null; rerenderPlanEditor();
  }
  function planSetColumnSection(i,j,prop,val){ planSetColSection(`${i},${j}`,prop,val); }
  function planClearColumnSection(i,j){ planPushUndo(); planRemoveColSection(`${i},${j}`); }

  /* ═════ TEMPLATES ═════ */
  function planTemplate(shape){
    planPushUndo();
    const p=state.project.plan, nx=p.gridX.length, ny=p.gridY.length;
    p.columns={};
    for(let i=0;i<nx;i++){ p.columns[i]={};
      for(let j=0;j<ny;j++){
        let keep=true;
        if(shape==='L'){ if(i>0&&j>0) keep=false; }
        else if(shape==='U'){ if(i>0&&i<nx-1&&j>0) keep=false; }
        else if(shape==='corridor'){ if(j>0&&j<ny-1) keep=false; }
        if(!keep) p.columns[i][j]=false;
      }
    }
    rerenderPlanEditor(); toast('Template '+shape+' appliqué');
  }
  function planQuickGrid(){
    const nx=parseInt(prompt('Nombre de travées X:','4'))||4;
    const lx=parseFloat(prompt('Espacement moyen X (m):','4.5'))||4.5;
    const ny=parseInt(prompt('Nombre de travées Y:','3'))||3;
    const ly=parseFloat(prompt('Espacement moyen Y (m):','4.0'))||4.0;
    planPushUndo();
    const gx=[],gy=[];
    for(let i=0;i<=nx;i++) gx.push(+(i*lx).toFixed(2));
    for(let j=0;j<=ny;j++) gy.push(+(j*ly).toFixed(2));
    state.project.plan.gridX=gx; state.project.plan.gridY=gy;
    state.project.plan.columns={}; state.project.plan.columnSections={};
    rerenderPlanEditor(); toast(`${nx}×${ny} travées générées`);
  }

  /* ═════ CANVAS DRAW ═════ */
  function drawPlanCanvas(){
    const p=state.project.plan, tf=planTF();
    const gx=p.gridX, gy=p.gridY, nx=gx.length, ny=gy.length;
    const cols=p.columns||{}, ovs=p.columnSections||{}, defB=defaultColB();
    let s='';
    const stepPx=planUI.snapSize*tf.scale;
    if(stepPx>7){
      const [x0,y0]=tf.toScreen(gx[0],gy[ny-1]);
      const [x1,y1]=tf.toScreen(gx[nx-1],gy[0]);
      for(let sx=x0;sx<=x1;sx+=stepPx) for(let sy=y0;sy<=y1;sy+=stepPx)
        s+=`<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="0.8" fill="${C.muted}" opacity="0.25"/>`;
    }
    gx.forEach((x,i)=>{
      const [sx1,sy1]=tf.toScreen(x,gy[0]), [sx2,sy2]=tf.toScreen(x,gy[ny-1]);
      s+=`<line x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}" stroke="${C.muted}" stroke-dasharray="6,4"/>`;
      const [bx,by]=tf.toScreen(x,gy[ny-1]);
      s+=`<circle cx="${bx}" cy="${by-30}" r="14" fill="${C.accent}"/>`;
      s+=`<text x="${bx}" y="${by-25}" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">${String.fromCharCode(65+i)}</text>`;
    });
    gy.forEach((y,j)=>{
      const [sx1,sy1]=tf.toScreen(gx[0],y), [sx2,sy2]=tf.toScreen(gx[nx-1],y);
      s+=`<line x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}" stroke="${C.muted}" stroke-dasharray="6,4"/>`;
      const [bx,by]=tf.toScreen(gx[0],y);
      s+=`<circle cx="${bx-30}" cy="${by}" r="14" fill="${C.accent}"/>`;
      s+=`<text x="${bx-30}" y="${by+4}" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">${j+1}</text>`;
    });
    (p.walls||[]).forEach((w,k)=>{
      const [x1,y1]=tf.toScreen(w.x1,w.y1), [x2,y2]=tf.toScreen(w.x2,w.y2);
      const col=w.kind==='noyau'?'#f59e0b':C.rebar;
      const baseSw=Math.max(4,(w.t||20)*tf.scale/100);
      const isSel=planUI.selection&&planUI.selection.type==='wall'&&planUI.selection.id===k;
      const isHov=planUI.hover&&planUI.hover.type==='wall'&&planUI.hover.id===k;
      const sw=isSel?baseSw+4:isHov?baseSw+2:baseSw;
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" opacity="${isSel?1:0.7}"/>`;
      if(isSel){
        s+=`<circle cx="${x1}" cy="${y1}" r="5" fill="#fff" stroke="${col}" stroke-width="2"/>`;
        s+=`<circle cx="${x2}" cy="${y2}" r="5" fill="#fff" stroke="${col}" stroke-width="2"/>`;
      }
    });
    for(let i=0;i<nx;i++) for(let j=0;j<ny;j++){
      const active=!(cols[i]&&cols[i][j]===false);
      const ov=ovs[`${i},${j}`], b=ov?ov.b:defB;
      const sz=Math.max(11,b*tf.scale/100), [cx,cy]=tf.toScreen(gx[i],gy[j]);
      const lbl=String.fromCharCode(65+i)+(j+1);
      const isSel=planUI.selection&&planUI.selection.type==='column'&&planUI.selection.i===i&&planUI.selection.j===j;
      const isHov=planUI.hover&&planUI.hover.type==='column'&&planUI.hover.i===i&&planUI.hover.j===j;
      if(active){
        const fill=isSel?'#dc2626':isHov?'#1d4ed8':(ov?'#8b5cf6':C.accent);
        const stroke=isSel?'#7f1d1d':'#1e40af';
        s+=`<rect x="${cx-sz/2}" y="${cy-sz/2}" width="${sz}" height="${sz}" fill="${fill}" stroke="${stroke}" stroke-width="${isSel?2.5:1.5}"/>`;
        if(sz>=16&&!isSel) s+=`<text x="${cx}" y="${cy+3}" text-anchor="middle" font-size="8" fill="#fff" font-weight="700" pointer-events="none">${lbl}</text>`;
      } else {
        s+=`<rect x="${cx-6}" y="${cy-6}" width="12" height="12" fill="none" stroke="${C.muted}" stroke-width="1" stroke-dasharray="2,2"/>`;
      }
    }
    if(planUI.drag){
      const d=planUI.drag;
      if(d.type==='drawWall'){
        const [x1,y1]=tf.toScreen(d.start.x,d.start.y), [x2,y2]=tf.toScreen(d.current.x,d.current.y);
        s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.accent}" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>`;
        const dx=d.current.x-d.start.x, dy=d.current.y-d.start.y;
        const L=Math.hypot(dx,dy), ang=Math.atan2(dy,dx)*180/Math.PI;
        const mx=(x1+x2)/2, my=(y1+y2)/2-18;
        s+=`<rect x="${mx-62}" y="${my-12}" width="124" height="22" fill="#fff" stroke="${C.accent}" rx="4"/>`;
        s+=`<text x="${mx}" y="${my+3}" text-anchor="middle" font-size="11" fill="${C.accent}" font-family="monospace" font-weight="700">L=${L.toFixed(2)}m · ${ang.toFixed(0)}°</text>`;
      } else if(d.type==='drawNoyau'){
        const x1=Math.min(d.start.x,d.current.x), x2=Math.max(d.start.x,d.current.x);
        const y1=Math.min(d.start.y,d.current.y), y2=Math.max(d.start.y,d.current.y);
        const [sx1,sy1]=tf.toScreen(x1,y2), [sx2,sy2]=tf.toScreen(x2,y1);
        s+=`<rect x="${sx1}" y="${sy1}" width="${sx2-sx1}" height="${sy2-sy1}" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>`;
        const mx=(sx1+sx2)/2, my=sy1-18;
        s+=`<rect x="${mx-62}" y="${my-12}" width="124" height="22" fill="#fff" stroke="#f59e0b" rx="4"/>`;
        s+=`<text x="${mx}" y="${my+3}" text-anchor="middle" font-size="11" fill="#f59e0b" font-family="monospace" font-weight="700">${(x2-x1).toFixed(2)}×${(y2-y1).toFixed(2)}m</text>`;
      }
    }
    if(planUI.mode!=='select'&&planUI.mode!=='delete'&&planUI.cursor){
      const [sx,sy]=tf.toScreen(planUI.cursor.x,planUI.cursor.y);
      if(planUI.cursor.snappedX||planUI.cursor.snappedY){
        s+=`<circle cx="${sx}" cy="${sy}" r="8" fill="none" stroke="${C.rebar}" stroke-width="2"/>`;
        s+=`<line x1="${sx-13}" y1="${sy}" x2="${sx-5}" y2="${sy}" stroke="${C.rebar}" stroke-width="2"/>`;
        s+=`<line x1="${sx+5}" y1="${sy}" x2="${sx+13}" y2="${sy}" stroke="${C.rebar}" stroke-width="2"/>`;
        s+=`<line x1="${sx}" y1="${sy-13}" x2="${sx}" y2="${sy-5}" stroke="${C.rebar}" stroke-width="2"/>`;
        s+=`<line x1="${sx}" y1="${sy+5}" x2="${sx}" y2="${sy+13}" stroke="${C.rebar}" stroke-width="2"/>`;
      } else {
        s+=`<circle cx="${sx}" cy="${sy}" r="6" fill="none" stroke="${C.accent}" stroke-width="1.5" opacity="0.6"/>`;
      }
      s+=`<rect x="${sx+15}" y="${sy-25}" width="120" height="20" fill="#fff" stroke="${C.accent}" rx="3" opacity="0.92"/>`;
      s+=`<text x="${sx+20}" y="${sy-11}" font-size="10" fill="${C.accent}" font-family="monospace">X=${planUI.cursor.x.toFixed(2)} Y=${planUI.cursor.y.toFixed(2)}</text>`;
    }
    const cursorStyle=planUI.mode==='select'?'default':planUI.mode==='addCol'?'cell':planUI.mode==='delete'?'not-allowed':'crosshair';
    return `<svg id="plan_svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PLAN_W} ${PLAN_H}" style="width:100%;height:100%;display:block;background:#fafbfc;cursor:${cursorStyle};user-select:none" onmousedown="UI.onCanvasMouseDown(event)" onmousemove="UI.onCanvasMouseMove(event)" onmouseup="UI.onCanvasMouseUp(event)" onwheel="UI.onCanvasWheel(event)" onmouseleave="UI.onCanvasMouseLeave()">${s}</svg>`;
  }

  /* ═════ MODULE RENDERING ═════ */
  function eqCard(eq){
    let katexHtml = '';
    try { if(window.katex) katexHtml = katex.renderToString(eq.latex,{displayMode:true,throwOnError:false}); }
    catch(e){ katexHtml = `<code style="font-family:var(--mono);color:var(--err);font-size:11px">${esc(eq.latex)}</code>`; }
    const legend = eq.legend ? `<div class="legend">${eq.legend.map(l=>`<span class="v">${l[0]}</span> : ${l[1]} <span style="color:var(--txt3)">[${l[2]}]</span>`).join(' · ')}</div>` : '';
    const ref = eq.ref ? `<div class="ref">Réf. ${eq.ref}</div>` : '';
    return `<div class="eq-card"><div class="eq-title">${eq.title||'Équation'}</div><div class="eq-body">${katexHtml}</div>${legend}${ref}</div>`;
  }
  function renderModule(m){
    let h = `<div class="view-h">${m.icon} ${esc(m.title)}</div>`;
    h += `<p class="view-sub">${esc(m.subtitle||'')}</p>`;
    if(m.eq) m.eq.forEach(e=>h+=eqCard(e));
    h += `<div class="card"><h3 class="card-h">Données d'entrée</h3><div class="inputs">`;
    m.inputs.forEach(inp=>{
      h += `<div class="inp"><label>${inp.label}</label><input type="number" id="${inp.id}" value="${inp.v}" step="${inp.s||1}" oninput="UI.runCalc('${m.id}')"></div>`;
    });
    h += `</div><div class="btn-row"><button class="btn btn-pri" onclick="UI.runCalc('${m.id}')">🔢 Calculer</button><button class="btn btn-out" onclick="window.print()">🖨 Imprimer</button></div></div>`;
    h += `<div class="card"><h3 class="card-h">Résultats</h3><div class="result-wrap"><div class="result" id="res-${m.id}"></div><div class="diagram" id="diag-${m.id}"></div></div>`;
    if(m.academic) h += `<div class="academic-block">${m.academic}</div>`;
    h += `</div>`;
    return h;
  }

  /* ═════ WIZARD ═════ */
  function renderWizard(){
    const v=state.wizard.v, step=state.wizard.step;
    let h = `<div class="wizard-hero"><h2>🧙 Assistant StructuraDZ</h2><p>Quelques questions et l'app génère un plan de structure éditable + tous les modules pré-remplis.</p></div>`;
    h += `<div class="wizard-steps">`;
    for(let i=0;i<4;i++) h += `<div class="wizard-step ${i<step?'done':i===step?'active':''}"></div>`;
    h += `</div><div class="card"><h3 class="card-h">Étape ${step+1} / 4</h3><div class="inputs">`;
    if(step===0){
      h += wzField('Nom du projet','name','text');
      h += wzField('Type','type','select',[['logement','Logement collectif'],['bureau','Bureaux'],['villa','Villa'],['ecole','École']]);
      h += wzField('Niveaux','n','number');
    } else if(step===1){
      h += wzField('Code','code','select',[['rpa2024','RPA 2024'],['rpa2003','RPA 99/2003']]);
      h += wzField('Zone','zone','select',[['I','I'],['II','II'],['IIa','IIa'],['IIb','IIb'],['III','III'],['IV','IV'],['V','V'],['VI','VI']]);
      h += wzField('Site','site','select',[['S1','S1'],['S2','S2'],['S3','S3'],['S4','S4']]);
      h += wzField('Groupe','group','select',[['1A','1A'],['1B','1B'],['2','2'],['3','3']]);
      h += wzField('Système','system','select',[['portiques','Portiques'],['voiles','Voiles'],['mixte','Mixte']]);
    } else if(step===2){
      h += wzField('Lx (m)','lx','number');
      h += wzField('Ly (m)','ly','number');
      h += wzField('Travées X','nx','number');
      h += wzField('Travées Y','ny','number');
      h += wzField('h étage (m)','h','number');
    } else {
      h += wzField('f_c28 (MPa)','fc28','number');
      h += wzField('f_e (MPa)','fe','number');
      h += wzField('σ sol (MPa)','ss','number');
    }
    h += `</div><div class="btn-row">`;
    if(step>0) h += `<button class="btn btn-out" onclick="UI.wizardPrev()">← Précédent</button>`;
    if(step<3) h += `<button class="btn btn-pri" onclick="UI.wizardNext()">Suivant →</button>`;
    else h += `<button class="btn btn-pri" onclick="UI.wizardApply()">✓ Créer le projet</button>`;
    h += `</div></div>`;
    return h;
  }
  function wzField(label,id,type,opts){
    const v=state.wizard.v[id];
    if(type==='select') return `<div class="inp"><label>${label}</label><select onchange="UI.wizardSet('${id}',this.value)">${opts.map(o=>`<option value="${o[0]}"${o[0]==v?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
    return `<div class="inp"><label>${label}</label><input type="${type||'number'}" step="any" value="${esc(v)}" oninput="UI.wizardSet('${id}',this.value)"></div>`;
  }
  function wizardSet(id,val){
    const txt=['name','type','code','zone','site','group','system'].includes(id);
    state.wizard.v[id] = txt?val:parseFloat(val);
  }
  function wizardNext(){ if(state.wizard.step<3){ state.wizard.step++; renderView(); } }
  function wizardPrev(){ if(state.wizard.step>0){ state.wizard.step--; renderView(); } }
  function openWizard(){ state.wizard.step=0; show('wizard'); }
  function wizardApply(){
    const v=state.wizard.v;
    state.project.name = v.name||'Projet sans titre';
    document.getElementById('gCode').value=v.code;
    document.getElementById('gZone').value=v.zone;
    document.getElementById('gSite').value=v.site;
    document.getElementById('gGroup').value=v.group;
    document.getElementById('gSystem').value=v.system;
    state.project.globals = globals();
    deriveInputs(v);
    state.project.plan = buildPlanFromWizard(v);
    scheduleSave(); toast('Projet créé'); show('plan');
  }
  function deriveInputs(v){
    const n=Math.max(1,Math.round(v.n||8)), lx=v.lx||4.5, ly=v.ly||4.5;
    const lmax=Math.max(lx,ly), lmin=Math.min(lx,ly);
    const hp=Math.max(30,Math.ceil(lmax*100/12/5)*5), bp=Math.max(25,Math.round(hp*0.5/5)*5);
    const epD=Math.max(12,Math.ceil(lmin*100/30));
    const S=lx*ly, Gp=5.42, Qp=v.type==='bureau'?2.5:(v.type==='ecole'?4:1.5);
    const aP=Math.max(30,Math.min(80,30+Math.ceil(n*3.5/5)*5));
    const sets = {
      pd_Lx:lmin, pd_Ly:lmax, pd_Lp:lmax, pd_Ns:Math.round(S*(Gp+0.5*Qp)*(n+1)), pd_he:v.h,
      dc_S:+S.toFixed(2), dc_G:Gp, dc_Q:Qp, dc_Gt:5.61, dc_Qt:1.0, dc_n:n, dc_pp:6.75,
      pg_Lx:lmin, pg_Ly:lmax, pg_ep:epD, pg_G:Gp-0.13, pg_Q:Qp, pg_fc28:v.fc28, pg_fe:v.fe,
      po_b:bp, po_h:hp, po_Mu:Math.round((1.35*Gp+1.5*Qp)*lmax*lmax/10*5), po_Vu:Math.round((1.35*Gp+1.5*Qp)*lmax*lx/2.2), po_Ms:Math.round((1.35*Gp+1.5*Qp)*lmax*lmax/10*5/1.4),
      po_fc28:v.fc28, po_fe:v.fe,
      pt_b:aP, pt_h:aP, pt_l0:v.h, pt_fc28:v.fc28, pt_fe:v.fe,
      fl_L:lmax, fl_b0:bp, fl_h:hp, fl_d:hp-3, fl_b:bp*2.5, fl_As:8, fl_fc28:v.fc28,
      sm_a:aP, sm_b:aP, sm_ss:v.ss,
      sp_R:3.5, sp_Q:1.0, sp_W:Math.round(S*4*3*(Gp+0.2*Qp)*(n+1)), sp_T:+(0.05*Math.pow((n+1)*v.h,0.75)).toFixed(3), sp_xi:7,
      vpd_P:1000, vpd_D:50, vpd_V:2000, vpd_h:v.h,
      lq_z:6, lq_N:15, lq_Mw:7.0, lq_wt:3, lq_g:18,
      mo_n:n+1, mo_h:v.h, mo_W:Math.round(S*4*3*(Gp+0.2*Qp)*(n+1)), mo_nc:20, mo_c1:aP+15, mo_c2:aP, mo_c3:Math.max(30,aP-10), mo_fc28:v.fc28, mo_R:3.5, mo_D:Math.max(15,lmin*3),
      es_H:v.h, es_fc28:v.fc28, es_fe:v.fe,
      ra_Ns:Math.round(S*4*3*(Gp+0.3*Qp)*(n+1)), ra_Sb:+(S*12).toFixed(1), ra_ss:v.ss, ra_Lmax:lmax, ra_fc28:v.fc28, ra_fe:v.fe,
      vo_L:Math.max(2,lmin), vo_he:v.h, vo_fc28:v.fc28, vo_fe:v.fe,
      no_a:2.4, no_b:2.6, no_t:20, no_H:(n+1)*v.h, no_fc28:v.fc28
    };
    state.project.data = Object.assign({},state.project.data,sets);
  }

  /* ═════ CALC INPUT ═════ */
  function readInputs(moduleId){
    const m = SDZ.modules.find(x=>x.id===moduleId); if(!m) return {};
    const v = {};
    m.inputs.forEach(inp=>{
      const el = document.getElementById(inp.id);
      const val = el ? parseFloat(el.value) : inp.v;
      v[inp.id.replace(/^\w+_/,'')] = isFinite(val)?val:inp.v;
    });
    const g = globals();
    return Object.assign({},v,{code:g.code,zone:g.zone,site:g.site,group:g.group,duct:g.duct});
  }
  function runCalc(moduleId){
    const m = SDZ.modules.find(x=>x.id===moduleId); if(!m) return;
    const inputs = readInputs(moduleId);
    const resEl = document.getElementById('res-'+moduleId);
    const diagEl = document.getElementById('diag-'+moduleId);
    if(!resEl) return;
    let result;
    try { result = m.calc(inputs); }
    catch(e){ resEl.innerHTML = `<div class="err-banner">Erreur : ${e.message}</div>`; return; }
    if(!result.ok){
      const errs = result.errors ? result.errors.map(e=>e.msg||e).join(' · ') : (result.err||'Données invalides');
      resEl.innerHTML = `<div class="err-banner">${errs}</div>`;
      diagEl.innerHTML = '';
      return;
    }
    state.lastResults[moduleId] = result.data;
    resEl.innerHTML = m.result(result.data);
    if(m.diagram && diagEl){
      try { diagEl.innerHTML = m.diagram(result.data) + (m.diagCap?`<div class="diag-cap">${m.diagCap}</div>`:''); }
      catch(e){ console.error('Diagram:',e); }
    }
    updateSticky(moduleId, result.data, m);
  }
  function updateSticky(moduleId, d, m){
    const bar = document.getElementById('stickyBar');
    const t = document.getElementById('sbTitle'), v = document.getElementById('sbVal');
    const u = document.getElementById('sbUnit'), b = document.getElementById('sbBadge');
    if(!d) return;
    let val='—', unit='', label=m.title, badge='—', cls='info';
    switch(moduleId){
      case 'mat': val=SS.f(d.fbc); unit='MPa'; break;
      case 'predim': val=d.hp+'×'+d.bp; unit='cm'; break;
      case 'descente': val=SS.f(d.NsBase,0); unit='kN'; break;
      case 'pigeaud': val=SS.f(d.Ax); unit='cm²/ml'; break;
      case 'poutre': val=SS.f(d.Ast); unit='cm²';
        if(d.tau<=d.tauLim&&!d.dbl){ badge='✓'; cls='ok'; } else { badge='⚠'; cls='warn'; } break;
      case 'poteau': val=SS.f(d.nu,3); unit='ν';
        if(d.nu<=d.nuLim24){ badge='✓'; cls='ok'; } else { badge='✗'; cls='bad'; } break;
      case 'fleche': val=SS.f(d.fMM); unit='mm';
        if(d.fMM<=d.fLimMM){ badge='✓'; cls='ok'; } else { badge='✗'; cls='bad'; } break;
      case 'semelle': val=SS.f(d.A*100,0); unit='cm'; break;
      case 'voileper': val=SS.f(d.Ka,3); unit='K_a'; break;
      case 'spectre': val=SS.f(d.V,0); unit='kN'; break;
      case 'verifs': val=SS.f(d.theta,3); unit='θ';
        if(d.theta<=0.10){ badge='✓'; cls='ok'; } else if(d.theta<=0.20){ badge='⚠'; cls='warn'; } else { badge='✗'; cls='bad'; } break;
      case 'liquef': val=SS.f(d.FS,2); unit='FS';
        if(d.FS>=1.25){ badge='✓'; cls='ok'; } else if(d.FS>=1.0){ badge='⚠'; cls='warn'; } else { badge='✗'; cls='bad'; } break;
      case 'modal': val=SS.f(d.Vdyn,0); unit='kN';
        if(d.dmax<=d.lim){ badge='✓'; cls='ok'; } else { badge='✗'; cls='bad'; } break;
      case 'escalier': val=SS.f(d.blondel,0); unit='cm';
        if(d.blondel>=59&&d.blondel<=66){ badge='✓'; cls='ok'; } else { badge='✗'; cls='bad'; } break;
      case 'radier': val=SS.f(d.sig,0); unit='kPa';
        if(d.sig<=d.ss){ badge='✓'; cls='ok'; } else { badge='✗'; cls='bad'; } break;
      case 'voile': val=SS.f(d.Av); unit='cm²'; break;
      case 'noyau': val=SS.f(d.ratio*100,1); unit='%'; break;
    }
    t.textContent = label;
    v.textContent = val;
    u.textContent = unit;
    b.textContent = badge;
    b.className = 'badge '+cls;
    bar.classList.add('show');
  }

  /* ═════ SIDEBAR ═════ */
  function buildSidebar(){
    const sb = document.getElementById('sidebar');
    const groups = {};
    SDZ.modules.forEach(m=>{ (groups[m.cat]=groups[m.cat]||[]).push(m); });
    const order = ['Base','Phase 1','Phase 2','Phase 3','Phase 4','Analyse','Nouveaux'];
    let html = `<button class="sb-btn ${state.view==='wizard'?'active':''}" data-id="wizard" onclick="UI.show('wizard')">🧙 Assistant</button>`;
    html += `<button class="sb-btn ${state.view==='dashboard'?'active':''}" data-id="dashboard" onclick="UI.show('dashboard')">📊 Tableau de bord</button>`;
    html += `<button class="sb-btn sb-pri ${state.view==='plan'?'active':''}" data-id="plan" onclick="UI.show('plan')">🗺 Plan éditeur</button>`;
    order.forEach(cat=>{
      if(!groups[cat]) return;
      html += `<div class="sidebar-group">${cat}</div>`;
      groups[cat].forEach(m=>{
        html += `<button class="sb-btn ${state.view===m.id?'active':''}" data-id="${m.id}" onclick="UI.show('${m.id}')">${m.icon} ${m.title}</button>`;
      });
    });
    sb.innerHTML = html;
  }

  /* ═════ VIEW SWITCH ═════ */
  function renderView(){
    const main = document.getElementById('main');
    if(state.view==='wizard') main.innerHTML = renderWizard();
    else if(state.view==='dashboard') main.innerHTML = renderDashboard();
    else if(state.view==='plan') renderPlanEditor();
    else {
      const m = SDZ.modules.find(x=>x.id===state.view);
      if(m){ main.innerHTML = renderModule(m); setTimeout(()=>runCalc(m.id),20); }
    }
    document.querySelectorAll('.sb-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.id===state.view);
    });
    window.scrollTo(0,0);
  }
  function show(view){
    state.view=view;
    if(view!=='plan'){ planUI.selection=null; planUI.drag=null; planUI.hover=null; }
    renderView();
    document.getElementById('stickyBar').classList.remove('show');
  }

  /* ═════ KEYBOARD ═════ */
  document.addEventListener('keydown', e=>{
    if(state.view!=='plan') return;
    if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
    const k=e.key;
    if(k==='Escape'){ planUI.selection=null; planUI.drag=null; renderPlanEditor(); }
    else if(k==='Delete'||k==='Backspace'){
      if(planUI.selection){
        planPushUndo();
        if(planUI.selection.type==='column') planToggleColumn(planUI.selection.i,planUI.selection.j);
        else if(planUI.selection.type==='wall'){ state.project.plan.walls.splice(planUI.selection.id,1); rerenderPlanEditor(); }
        planUI.selection=null;
      }
    }
    else if(e.ctrlKey&&k==='z'){ e.preventDefault(); planUndo(); }
    else if(e.ctrlKey&&k==='y'){ e.preventDefault(); planRedo(); }
    else if(k==='1'){ planUI.mode='select'; renderPlanEditor(); }
    else if(k==='2'){ planUI.mode='addCol'; renderPlanEditor(); }
    else if(k==='3'){ planUI.mode='drawWall'; renderPlanEditor(); }
    else if(k==='4'){ planUI.mode='drawNoyau'; renderPlanEditor(); }
    else if(k==='5'){ planUI.mode='delete'; renderPlanEditor(); }
    else if(k==='0'){ planUIFitView(); }
  });

  /* ═════ PERSISTENCE ═════ */
  function snapshot(){
    return JSON.stringify({app:'StructuraDZ Pro',version:51,project:state.project,view:state.view},null,1);
  }
  function applySnapshot(json){
    try {
      const o = JSON.parse(json), p = o.project||o;
      state.project = Object.assign(state.project, p);
      planEnsure();
      if(p.globals){
        document.getElementById('gCode').value = p.globals.code||'rpa2024';
        document.getElementById('gZone').value = p.globals.zone||'III';
        document.getElementById('gSite').value = p.globals.site||'S2';
        document.getElementById('gGroup').value = p.globals.group||'2';
        document.getElementById('gSystem').value = p.globals.system||'mixte';
        document.getElementById('gDuct').value = p.globals.duct||'DCH';
      }
      if(p.data){
        // v5 → v5.1 migration: es_fc/vo_fc/no_fc → *_fc28
        ['es','vo','no'].forEach(pfx=>{
          if(p.data[pfx+'_fc']!==undefined && p.data[pfx+'_fc28']===undefined){
            p.data[pfx+'_fc28'] = p.data[pfx+'_fc'];
            delete p.data[pfx+'_fc'];
          }
        });
        Object.keys(p.data).forEach(id=>{
          const el = document.getElementById(id);
          if(el&&p.data[id]!==undefined) el.value = p.data[id];
        });
      }
      if(o.view) state.view = o.view;
      return true;
    } catch(e){ return false; }
  }
  let saveT;
  function scheduleSave(){ clearTimeout(saveT); saveT=setTimeout(autosave,400); }
  function autosave(){ try{ localStorage.setItem(LS_KEY,snapshot()); }catch(e){} }
  function saveFile(){
    const blob = new Blob([snapshot()],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (state.project.name||'projet').replace(/[^\w\-]+/g,'_')+'.structuradz.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500);
    toast('Sauvegardé');
  }
  function loadFile(){
    const input = document.createElement('input'); input.type='file'; input.accept='.json';
    input.onchange = ()=>{
      const f = input.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{ if(applySnapshot(r.result)){ toast('Chargé'); buildSidebar(); show(state.view); } else toast('Invalide'); };
      r.readAsText(f);
    };
    input.click();
  }

  /* ═════ TESTS MODAL ═════ */
  function showTests(){
    const results = SDZ.runTests(), passed = results.filter(r=>r.pass).length;
    const modal = document.createElement('div');
    modal.className = 'modal-bg';
    modal.onclick = e => { if(e.target===modal) modal.remove(); };
    modal.innerHTML = `<div class="modal"><div class="modal-h"><span>✓ Tests golden (${passed}/${results.length})</span><button class="btn btn-sm btn-out" onclick="this.closest('.modal-bg').remove()">✕</button></div><div style="max-height:60vh;overflow:auto">${results.map(r=>`<div class="res-row"><span class="rl">${r.pass?'<span class="badge ok">✓</span>':'<span class="badge bad">✗</span>'} ${esc(r.name)}</span>${r.err?`<span class="rv" style="color:var(--err)">${esc(r.err)}</span>`:''}</div>`).join('')}</div></div>`;
    document.getElementById('modalHost').appendChild(modal);
  }

  /* ═════ THEME & MODE ═════ */
  function setupTheme(){ const btn=document.getElementById('themeBtn');
    btn.onclick = ()=>{ document.body.classList.toggle('dark');
      const dark = document.body.classList.contains('dark');
      btn.textContent = dark?'☀':'🌙'; state.theme = dark?'dark':'light'; }; }
  function setupMode(){ document.querySelectorAll('.mode-switch button').forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll('.mode-switch button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); state.mode = b.dataset.mode;
      document.body.classList.toggle('academic', state.mode==='academic'); }; }); }

  /* ═════ INIT ═════ */
  function init(){
    setupTheme(); setupMode();
    let restored = false;
    try { const saved = localStorage.getItem(LS_KEY);
      if(saved && applySnapshot(saved)) restored = true; } catch(e){}
    planEnsure();
    buildSidebar();
    if(!restored) state.view = 'wizard';
    renderView();
    document.addEventListener('keydown', e=>{
      if(e.ctrlKey && e.key==='s'){ e.preventDefault(); saveFile(); }
      if(e.key==='Escape' && state.view!=='plan') document.getElementById('modalHost').innerHTML='';
    });
    document.getElementById('main').addEventListener('input', e=>{
      const t = e.target; if(t.id && t.tagName==='INPUT') state.project.data[t.id]=t.value;
      scheduleSave();
    });
    document.getElementById('main').addEventListener('change', e=>{
      const t = e.target; if(t.id) state.project.data[t.id]=t.value;
      scheduleSave();
    });
  }
  document.addEventListener('DOMContentLoaded', init);
  if(document.readyState!=='loading') init();

  return {
    show, runCalc, openWizard, wizardNext, wizardPrev, wizardSet, wizardApply,
    saveFile, loadFile, showTests, globalsChanged,
    setPlanMode, setPlanOrtho, setPlanSnap, planUIFitView, planUndo, planRedo,
    planDeleteSelected, planSetColumnSection, planClearColumnSection,
    planTemplate, planQuickGrid,
    onCanvasMouseDown, onCanvasMouseMove, onCanvasMouseUp, onCanvasWheel, onCanvasMouseLeave,
    planSetX, planSetY, planAddX, planAddY, planRemoveX, planRemoveY,
    planAutoDistributeX, planAutoDistributeY, planBatchX, planBatchY,
    planToggleColumn, planAllColumns, planInvertColumns,
    planSetColSection, planRemoveColSection, planAddColSection,
    planAddWall, planAddNoyau, planRemoveWall, planSetWall, planResetFromWizard
  };
})();
</script>
</body>
