<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StructuraDZ Pro v2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" onerror="window.katexFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="window.threeFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window.pdfFailed=true"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="window.xlsxFailed=true"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--bg4:#e2e8f0;
  --txt:#0f172a;--txt2:#475569;--txt3:#94a3b8;
  --line:#e2e8f0;--line2:#cbd5e1;
  --pri:#3b82f6;--pri2:#2563eb;--pri-bg:#dbeafe;
  --ok:#10b981;--ok-bg:#d1fae5;--warn:#f59e0b;--warn-bg:#fef3c7;
  --err:#ef4444;--err-bg:#fee2e2;--acad:#8b5cf6;--acad-bg:#ede9fe;
  --math-bg:#eff6ff;--math-border:#bfdbfe;
  --mono:"JetBrains Mono","Consolas",monospace;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
body.dark{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--bg4:#475569;
  --txt:#f1f5f9;--txt2:#cbd5e1;--txt3:#94a3b8;
  --line:#334155;--line2:#475569;
  --pri-bg:#1e3a8a;--ok-bg:#064e3b;--warn-bg:#78350f;--err-bg:#7f1d1d;
  --acad-bg:#4c1d95;--math-bg:#1e3a8a;--math-border:#3b82f6;
}
html,body{height:100%}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:13.5px;line-height:1.55;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.nav{background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
.nav-top{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;font-family:Cambria,serif}
.brand-text h1{font-size:15px;font-weight:700}
.brand-text p{font-size:10.5px;color:var(--txt3);font-weight:500}
.nav-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode-switch{display:inline-flex;background:var(--bg3);border-radius:8px;padding:3px;gap:2px}
.mode-switch button{padding:5px 12px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--txt2);transition:all .15s}
.mode-switch button.active{background:var(--pri);color:#fff}
.theme-btn{width:34px;height:34px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px}
.theme-btn:hover{background:var(--bg4)}

.nav-globals{padding:10px 20px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
@media(max-width:880px){.nav-globals{grid-template-columns:repeat(2,1fr)}}
.ng-item label{display:block;font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.ng-item select{width:100%;padding:6px 8px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:11.5px;font-family:inherit}
.ng-item select:focus{outline:none;border-color:var(--pri)}

.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 120px)}
@media(max-width:880px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--bg2);border-right:1px solid var(--line);padding:12px 8px 40px;overflow-y:auto;position:sticky;top:120px;height:calc(100vh - 120px)}
.sidebar-group{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.8px;padding:12px 10px 4px}
.sidebar-group:first-child{padding-top:0}
.sb-btn{display:block;width:100%;text-align:left;padding:7px 11px;font-size:12px;font-weight:500;color:var(--txt2);border-radius:6px;transition:all .12s;margin-bottom:1px}
.sb-btn:hover{background:var(--bg3);color:var(--txt)}
.sb-btn.active{background:var(--pri-bg);color:var(--pri);font-weight:600}

.main{padding:20px 24px 60px;overflow-x:hidden;max-width:1400px;margin:0 auto;width:100%}
.view{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.view-h{font-size:18px;font-weight:700;margin-bottom:3px}
.view-sub{color:var(--txt3);font-size:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-h::before{content:"";width:3px;height:14px;background:var(--pri);border-radius:2px}

/* ===== LATEX EQUATION BLOCK ===== */
.eq-block{
  background:var(--math-bg);
  border:1px solid var(--math-border);
  border-left:4px solid var(--pri);
  border-radius:0 8px 8px 0;
  padding:14px 18px;
  margin-bottom:12px;
  overflow-x:auto;
  overflow-y:visible;
  min-height:2.6em;
  display:flex;
  align-items:center;
  justify-content:center;
}
.eq-block .katex{color:var(--pri);font-size:1.1em}
.eq-block .katex-display{margin:.2em 0}
body.dark .eq-block .katex{color:#93c5fd}
.eq-block .latex-src{font-family:var(--mono);font-size:11.5px;color:var(--err);background:rgba(0,0,0,.05);padding:4px 8px;border-radius:4px}

.inputs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.inp{display:flex;flex-direction:column;gap:3px}
.inp label{font-size:10.5px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px}
.inp label .katex{text-transform:none;letter-spacing:0}
.inp input,.inp select{padding:7px 10px;background:var(--bg3);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12.5px;font-family:var(--mono)}
.inp input:focus,.inp select:focus{outline:none;border-color:var(--pri);background:var(--bg2);box-shadow:0 0 0 3px var(--pri-bg)}

.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.btn{padding:8px 16px;border-radius:7px;font-size:12.5px;font-weight:600;transition:all .15s;border:1px solid transparent}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:hover{background:var(--pri2)}
.btn-out{background:var(--bg3);color:var(--txt2);border-color:var(--line2)}
.btn-out:hover{background:var(--bg4);color:var(--txt)}

.result-wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.result-wrap{grid-template-columns:1fr}}
.result{background:var(--bg3);border-radius:8px;padding:12px 14px;font-size:12px}
.res-sec{font-size:10px;font-weight:700;color:var(--ok);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px;padding-bottom:3px;border-bottom:1px dashed var(--line2)}
.res-sec:first-child{margin-top:0}
.res-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);gap:8px}
.res-row:last-child{border-bottom:none}
.res-row .rl{color:var(--txt2);font-size:11.5px;flex-shrink:0}
.res-row .rl .katex{font-size:1.05em}
.res-row .rv{font-family:var(--mono);font-weight:600;color:var(--pri);text-align:right;font-size:11.5px}
body.dark .res-row .rv{color:#93c5fd}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid;margin:2px 2px 0 0}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.badge.bad{background:var(--err-bg);color:var(--err);border-color:var(--err)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.badge.info{background:var(--pri-bg);color:var(--pri);border-color:var(--pri)}

.diagram{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px}
body.dark .diagram{background:#0b1326}
.diagram svg{display:block;max-width:100%;height:auto}
.diag-cap{font-size:10px;color:var(--txt3);font-style:italic;margin-top:6px;text-align:center}

.academic-block{display:none;background:var(--acad-bg);border:1px solid var(--acad);border-radius:8px;padding:14px 18px;margin-top:12px;font-size:12.5px;line-height:1.8}
body.academic .academic-block{display:block}
.academic-block h4{font-size:11.5px;font-weight:700;color:var(--acad);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px}
.academic-block h4:first-child{margin-top:0}
.academic-block h4::before{content:"🎓 "}
.academic-block .ref{color:var(--txt3);font-size:10.5px;font-style:italic;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2)}
.academic-block .katex{color:var(--acad)}
body.dark .academic-block .katex{color:#c4b5fd}

.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.dash-card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.dash-card:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.08);border-color:var(--pri)}
.dash-icon{width:34px;height:34px;background:var(--pri-bg);color:var(--pri);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.dash-title{font-size:12.5px;font-weight:700;margin-bottom:3px}
.dash-desc{font-size:11px;color:var(--txt3);line-height:1.5}

.cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:720px){.cmp-grid{grid-template-columns:1fr}}
.cmp-card{padding:14px;border-radius:8px;border:2px solid}
.cmp-2003{border-color:#3b82f6;background:rgba(59,130,246,.06)}
.cmp-2024{border-color:#10b981;background:rgba(16,185,129,.06)}
.cmp-card h4{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}

.code-out{background:#0b1326;color:#e2e8f0;padding:12px;border-radius:6px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;max-height:400px;overflow-y:auto;line-height:1.6}
.muted{color:var(--txt3)}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
.katex{font-size:1.05em}

@media print{
  .nav,.sidebar,.btn-row,.mode-switch,.theme-btn{display:none!important}
  .layout{display:block}
  .main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .result-wrap{grid-template-columns:1fr}
}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 18px;border-radius:8px;font-size:12.5px;opacity:0;transition:all .25s;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--bg2);border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:15px}
.tb-btn{padding:6px 10px;border-radius:7px;background:var(--bg3);font-size:11.5px;font-weight:600;color:var(--txt2)}
.tb-btn:hover{background:var(--bg4);color:var(--txt)}
.tb-sel{padding:6px 8px;border-radius:7px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);font-size:11.5px}
.tbl{border-collapse:collapse;width:100%;font-size:11.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg3);font-weight:700}
.tuto-bar{border-color:var(--acad);background:var(--acad-bg)}
body.rtl{direction:rtl}
body.rtl .sidebar{border-right:none;border-left:1px solid var(--line)}
body.rtl .sb-btn{text-align:right}
body.rtl .res-row .rv{text-align:left}
.sb-btn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media print{.toast,.modal-bg,.tb-btn,.tb-sel,.tuto-bar{display:none!important}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-top">
    <div class="brand">
      <div class="brand-logo">DZ</div>
      <div class="brand-text">
        <h1>StructuraDZ Pro</h1>
        <p>BAEL91 · RPA 99/2003 · RPA 2024 — v2</p>
      </div>
    </div>
    <div class="nav-actions">
      <div class="mode-switch">
        <button data-mode="engineer" class="active">👷 Engineer</button>
        <button data-mode="academic">🎓 Academic</button>
      </div>
      <button class="theme-btn" id="themeBtn">🌙</button>
    </div>
  </div>
  <div class="nav-globals">
    <div class="ng-item"><label>Code</label>
      <select id="gCode"><option value="rpa2024">RPA 2024</option><option value="rpa2003">RPA 99 (2003)</option></select>
    </div>
    <div class="ng-item"><label>Zone</label>
      <select id="gZone">
        <option value="I">Zone I</option><option value="IIa">Zone IIa</option>
        <option value="IIb">Zone IIb</option><option value="III" selected>Zone III</option>
        <option value="IV">Zone IV</option><option value="V">Zone V</option>
      </select>
    </div>
    <div class="ng-item"><label>Site</label>
      <select id="gSite"><option value="S1">S1 — Rocheux</option><option value="S2" selected>S2 — Ferme</option><option value="S3">S3 — Meuble</option><option value="S4">S4 — Très meuble</option></select>
    </div>
    <div class="ng-item"><label>Système</label>
      <select id="gSystem"><option value="portiques">Portiques</option><option value="voiles">Voiles</option><option value="mixte" selected>Mixte</option></select>
    </div>
    <div class="ng-item"><label>Ductilité (2024)</label>
      <select id="gDuct"><option value="DCM">DCM</option><option value="DCH" selected>DCH</option></select>
    </div>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";

/* ============================================================
   LATEX MATH HELPERS
   ============================================================ */
var HAS_KATEX = (typeof katex !== 'undefined');
if (!HAS_KATEX) console.warn('KaTeX not loaded — using fallback');

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* Render a single LaTeX string to HTML (or fallback code) */
function tex(latex, displayMode) {
  if (HAS_KATEX) {
    try {
      return katex.renderToString(latex, {displayMode: !!displayMode, throwOnError: false, strict: false, trust: true});
    } catch(e) { console.error('KaTeX:', e, latex); }
  }
  return '<code class="latex-src">' + escapeHtml(latex) + '</code>';
}

/* Process inline $...$ in HTML strings */
function processInlineMath(html) {
  if (!HAS_KATEX || typeof html !== 'string') return html;
  var out = '', i = 0;
  while (i < html.length) {
    if (html[i] === '$' && html[i+1] === '$') {
      var endDD = html.indexOf('$$', i+2);
      if (endDD < 0) { out += escapeHtml(html.substr(i)); break; }
      var latexDD = html.substring(i+2, endDD);
      out += tex(latexDD, true);
      i = endDD + 2;
    } else if (html[i] === '$') {
      var endD = html.indexOf('$', i+1);
      if (endD < 0) { out += escapeHtml(html.substr(i)); break; }
      var latexD = html.substring(i+1, endD);
      if (!latexD.trim() || latexD.length > 500) { out += escapeHtml(html.substr(i, endD-i+1)); i = endD+1; continue; }
      out += tex(latexD, false);
      i = endD + 1;
    } else {
      out += html[i]; i++;
    }
  }
  return out;
}

/* Render all [data-latex] elements in the document */
function renderDisplayMaths() {
  if (!HAS_KATEX) return;
  document.querySelectorAll('[data-latex]').forEach(function(el) {
    if (!el.dataset.latex) return;
    try {
      katex.render(el.dataset.latex, el, {displayMode: true, throwOnError: false, strict: false, trust: true});
    } catch(e) {}
  });
}

/* ============================================================
   UTILS
   ============================================================ */
function $(id) { return document.getElementById(id); }
function nv(id, def) { var e=$(id); if(!e) return def||0; var v=parseFloat(e.value); return isFinite(v) ? v : (def||0); }
function nvs(id, def) { var e=$(id); return e ? e.value : def; }
function fmt(x, d) {
  if (d === undefined) d = 2;
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  var ax = Math.abs(x);
  if (ax >= 1e5 || (ax < 1e-3 && ax > 0)) return x.toExponential(2);
  return Number(x).toFixed(d);
}
function sec(t) { return '<div class="res-sec">' + t + '</div>'; }
function rr(l, v) { return '<div class="res-row"><span class="rl">' + l + '</span><span class="rv">' + v + '</span></div>'; }
function okB(t) { return '<span class="badge ok">✓ ' + t + '</span>'; }
function badB(t) { return '<span class="badge bad">✗ ' + t + '</span>'; }
function warnB(t) { return '<span class="badge warn">⚠ ' + t + '</span>'; }
function infoB(t) { return '<span class="badge info">ℹ ' + t + '</span>'; }
function chk(c, g, f) { return c ? okB(g) : badB(f); }
function safe(fn, ctx) { try { return fn(); } catch(e) { console.error(ctx||'', e); return null; } }

/* ============================================================
   GLOBAL STATE
   ============================================================ */
var STATE = { mode: 'engineer', theme: 'light' };
var ZONES = { I: 0.07, IIa: 0.10, IIb: 0.15, III: 0.20, IV: 0.25, V: 0.30 };
var SITES_2024_T1 = { S1:{S:1.00,TB:0.10,TC:0.40,TD:2.0}, S2:{S:1.20,TB:0.10,TC:0.50,TD:2.0}, S3:{S:1.30,TB:0.15,TC:0.60,TD:2.0}, S4:{S:1.35,TB:0.15,TC:0.70,TD:2.0} };
var SITES_2024_T2 = { S1:{S:1.00,TB:0.05,TC:0.25,TD:1.20}, S2:{S:1.30,TB:0.05,TC:0.30,TD:1.20}, S3:{S:1.55,TB:0.10,TC:0.40,TD:1.20}, S4:{S:1.80,TB:0.10,TC:0.50,TD:1.20} };
var SITES_2003 = { S1:{S:1.0,T1:0.15,T2:0.30}, S2:{S:1.2,T1:0.15,T2:0.40}, S3:{S:1.7,T1:0.15,T2:0.50}, S4:{S:2.5,T1:0.15,T2:0.70} };

function readGlobals() {
  return {
    code: (($('gCode')||{}).value) || 'rpa2024',
    zone: (($('gZone')||{}).value) || 'III',
    site: (($('gSite')||{}).value) || 'S2',
    system: (($('gSystem')||{}).value) || 'mixte',
    duct: (($('gDuct')||{}).value) || 'DCH'
  };
}
function getZoneA() { var g = readGlobals(); return ZONES[g.zone] || 0.20; }
function getSite() {
  var g = readGlobals();
  if (g.code === 'rpa2024') {
    var isT1 = ['IV','V'].indexOf(g.zone) >= 0;
    return (isT1 ? SITES_2024_T1 : SITES_2024_T2)[g.site] || SITES_2024_T2.S2;
  }
  return SITES_2003[g.site] || SITES_2003.S2;
}

/* ============================================================
   SVG HELPERS
   ============================================================ */
var C = { line:'#64748b', muted:'#94a3b8', accent:'#3b82f6', rebar:'#dc2626', conc:'#e2e8f0', concLine:'#94a3b8', soil:'#a16207', water:'#0ea5e9', load:'#ea580c', ok:'#10b981', err:'#ef4444' };

function svg(w, h, content) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" style="display:block;width:100%;max-width:'+w+'px;height:auto">'+content+'</svg>';
}

function drawSection(b, h, label, rebars) {
  var W=240, H=220, pad=30;
  var scale = Math.min((W-2*pad)/b, (H-2*pad-30)/h);

function pigInterp(rho, t) {
  rho = Math.max(t[0][0], Math.min(rho, t[t.length-1][0]));
  for (var i=0; i<t.length-1; i++) {
    if (rho >= t[i][0] && rho <= t[i+1][0]) {
      var u = (rho-t[i][0])/(t[i+1][0]-t[i][0]);
      return [t[i][1]+u*(t[i+1][1]-t[i][1]), t[i][2]+u*(t[i+1][2]-t[i][2])];
    }
  }
  return [t[0][1], t[0][2]];
}
function betaFromMu(mu) {
  if (mu <= 0) return 1;
  var d = 0.64-1.28*mu;
  if (d < 0) return null;
  var a = (0.8-Math.sqrt(d))/0.64;
  return 1-0.4*a;
}
var BARS = [];
[8,10,12,14,16,20,25].forEach(function(dia){for(var n=1;n<=8;n++)BARS.push({n:n,d:dia,a:n*Math.PI*dia*dia/400});});
function pickBars(need, minD) {
  minD = minD||10;
  var best = null;
  BARS.forEach(function(b){if(b.d>=minD && b.a>=need-1e-6 && (!best || b.a<best.a)) best=b;});
  return best;
}

reg({
  id: 'descente', cat: 'Phase 1', icon: '⬇',

  subtitle: 'Cumul avec dégression DTR BC 2.2',
  eq: [String.raw`N_s^{(i)} = \sum_{j=i}^{n} G_j + \psi_i \cdot \sum_{j=i}^{n} Q_j \quad ; \quad N_u = 1.35\,\Sigma G + 1.5\,\Sigma Q`],
  inputs: [

    var n=Math.max(1,Math.floor(nv('dc_n',12))), pp=nv('dc_pp',6.75), Gp=15.32;
    var Gf = S*G+Gp+pp;
    var Gc = [S*Gt+Gp+pp], sum = Gc[0], i;
    for (i=1; i<=n; i++) { sum+=Gf; Gc.push(sum); }
    var coefs={1:1,2:1,3:0.95,4:0.9,5:0.85,6:0.8,7:0.75,8:0.71,9:0.68,10:0.66,11:0.65,12:0.63,13:0.62,14:0.61};
    var Qc=[S*Qt], sQ=0;
    for (i=1; i<=n; i++) { sQ+=S*Q; Qc.push(S*Qt+(coefs[i]||0.61)*sQ); }

  },
  result: function(r) {
    var h = sec('Cumul par niveau') + '<div style="max-height:260px;overflow-y:auto">';

  },

  diagCap: 'Coupe verticale — cumul',
  academic: String.raw`<h4>Coefficients de dégression $\psi_i$</h4>
<p>DTR BC 2.2 — Les charges d'exploitation ne sont pas cumulées intégralement car la probabilité de leur présence simultanée sur tous les niveaux décroît avec le nombre de niveaux.</p>
<p><strong>Habitation</strong> : $\psi_1 = 1.0$, $\psi_2 = 1.0$, $\psi_3 = 0.95$, $\psi_4 = 0.90$, $\psi_5 = 0.85$, $\psi_6 = 0.80$, $\psi_7 = 0.75$, $\psi_8 = 0.71$, $\psi_{n \geq 9} \approx 0.65$ à $0.61$.</p>
<p><strong>Combinaison ELU</strong> : $N_u = 1.35\,\Sigma G + 1.5\,\Sigma(\psi_i Q_i)$</p>
<div class="ref">Réf. DTR BC 2.2 §6.1.</div>`
});

/* ========== PIGEAUD ========== */
reg({
  id: 'pigeaud', cat: 'Phase 2', icon: '▦',
  title: 'Dalle — Pigeaud',
  subtitle: '2 sens · ELU + ELS · corrections',
  eq: [String.raw`M_x = \mu_x \cdot q_u \cdot L_x^{2} \quad ; \quad M_y = \mu_y \cdot M_x \quad ; \quad \rho = \frac{L_x}{L_y} \in [0.4\,;\,1]`,
       String.raw`M_{\text{travée}} = 0.85\,M \quad ; \quad M_{\text{appui}} = -0.30\,M \quad ; \quad A_{st} = \frac{M}{\beta\,d\,\sigma_{st}}`],
  inputs: [
    {id:'pg_Lx', label:'$L_x$ (m)', v:1.55, s:0.05},
    {id:'pg_Ly', label:'$L_y$ (m)', v:1.70, s:0.05},
    {id:'pg_ep', label:'$e_p$ (cm)', v:15, s:1},
    {id:'pg_c', label:'$c$ (cm)', v:2, s:0.5},
    {id:'pg_G', label:'$G$ (kN/m²)', v:5.29, s:0.01},
    {id:'pg_Q', label:'$Q$ (kN/m²)', v:2.5, s:0.1},
    {id:'pg_fc28', label:'$f_{c28}$', v:25, s:1},
    {id:'pg_fe', label:'$f_e$', v:400, s:50}
  ],
  calc: function() {
    var Lx=nv('pg_Lx',1.55), Ly=nv('pg_Ly',1.70), ep=nv('pg_ep',15)/100, c=nv('pg_c',2)/100;
    var G=nv('pg_G',5.29), Q=nv('pg_Q',2.5), fc=nv('pg_fc28',25), fe=nv('pg_fe',400);
    if (Lx<=0||Ly<=0||ep<=0) return {err:true};
    var rho=Math.min(Lx,Ly)/Math.max(Lx,Ly), qu=1.35*G+1.5*Q, d=ep-c;
    var mE=pigInterp(rho,PIG_ELU), L=Math.min(Lx,Ly);
    var MxU=mE[0]*qu*L*L, MyU=mE[1]*MxU;
    var MxT=0.85*MxU, MyT=0.85*MyU, MxA=-0.3*MxU, MyA=-0.3*MyU;
    var fbu=0.85*fc/1.5, sig=fe/1.15;
    function st(M){var mu=M/(d*d*fbu*1000);var b=betaFromMu(mu);return b?M/(b*d*sig*1000)*10000:NaN;}
    var Ax=st(MxT), Ay=st(MyT);
    var Amin=0.23*d*(0.6+0.06*fc)/fe*10000;
    return {rho:rho, d:d*100, qu:qu, MxT:MxT, MyT:MyT, MxA:MxA, MyA:MyA, Ax:Math.max(Ax,Amin), Ay:Math.max(Ay,Amin), Lx:Lx, Ly:Ly};

    return sec('Coefficients') +
      rr('$\\rho$', fmt(r.rho,3)) +
      rr('$q_u$', fmt(r.qu,2)+' kN/m²') +
      rr('$d$', fmt(r.d,1)+' cm') +
      sec('Moments (kN·m/m)') +
      rr('$M_{x,\\text{travée}}$', fmt(r.MxT,2)) +
      rr('$M_{y,\\text{travée}}$', fmt(r.MyT,2)) +
      rr('$M_{x,\\text{appui}}$', fmt(r.MxA,2)) +
      rr('$M_{y,\\text{appui}}$', fmt(r.MyA,2)) +
      sec('Armatures (cm²/ml)') +
      rr('$A_x$', fmt(r.Ax,2)+' → '+(pA?pA.n+'HA'+pA.d:'—')) +
      rr('$A_y$', fmt(r.Ay,2)+' → '+(pAy?pAy.n+'HA'+pAy.d:'—')) +
      '<div style="margin-top:8px">'+chk(r.rho>=0.4, 'Panneau 2 sens', 'Panneau 1 sens')+'</div>';
  },
  diagram: function(r) { return r.err ? '' : drawPigeaudSlab(r.Lx, r.Ly, r.rho); },
  diagCap: 'Panneau de dalle',
  academic: String.raw`<h4>Méthode Pigeaud</h4>
<p>Pour une dalle rectangulaire chargée uniformément sur 4 côtés :</p>
<p>$$M_x = \mu_x \cdot q \cdot L_x^{2} \quad M_y = \mu_y \cdot q \cdot L_x^{2}$$</p>
<p>Les coefficients $\mu_x$, $\mu_y$ sont lus sur les abaques en fonction de $\rho = L_x/L_y$ et de $\nu$ (Poisson, $\nu=0$ ELU, $\nu=0.2$ ELS).</p>
<h4>Corrections réglementaires</h4>
<p>· Travée : $M_t = 0.85\,M$ (reprise de 15% pour continuité)</p>
<p>· Appui de rive : $M_a = -0.30\,M$ (encastrement partiel)</p>
<p>· CNF : $A_{\min} = 0.23\,d\,(0.6+0.06\,f_{c28})/f_e$</p>
<div class="ref">Réf. BAEL91 + abaques ITBTP. Applicable pour $0.4 \leq \rho \leq 1$.</div>`
});

reg({
  id: 'poteau', cat: 'Phase 2', icon: '▮',
  title: 'Poteau — Flexion composée',
  subtitle: 'SPC/SEC/SET + ν (RPA 2003 vs 2024)',
  eq: [String.raw`e_u = \frac{M_u}{N_u} \quad ; \quad \nu = \frac{N_d}{B_c \cdot f_{c28}}`,
       String.raw`\text{RPA 99/2003 : } \nu \leq 0.30 \quad ; \quad \text{RPA 2024 : } \nu \leq \begin{cases} 0.45 & (\text{DCM}) \\ 0.35 & (\text{DCH}) \end{cases}`],
  inputs: [
    {id:'pt_Nu', label:'$N_u$ (kN) [+ compression]', v:1200, s:10},
    {id:'pt_Mu', label:'$M_u$ (kN·m)', v:180, s:1},
    {id:'pt_b', label:'$b$ (cm)', v:45, s:5},
    {id:'pt_h', label:'$h$ (cm)', v:45, s:5},
    {id:'pt_c', label:'$c$ (cm)', v:3, s:0.5},
    {id:'pt_fc28', label:'$f_{c28}$', v:25, s:1},
    {id:'pt_fe', label:'$f_e$', v:400, s:50}
  ],
  calc: function() {
    var Nu=nv('pt_Nu',-1200), Mu=nv('pt_Mu',180), b=nv('pt_b',45)/100, h=nv('pt_h',45)/100, c=nv('pt_c',3)/100;
    var fc=nv('pt_fc28',25), fe=nv('pt_fe',400), g=readGlobals();
    if (b<=0||h<=0) return {err:true};
    var fbc=0.85*fc/1.5, sig=fe/1.15, d=h-c, halfHc=h/2-c;
    var eu = Math.abs(Nu)>1e-6 ? Mu/Nu : Infinity;
    var type='', As=0;
    if (Nu>0) {
      if (eu>=halfHc) type='SPC (hors aciers)';
      else type='SPC (dans aciers)';
      var Mr=Mu+Nu*(h/2-c), mu=Mr/(b*d*d*fbc*1000), sec=(Nu*(d-c)-Mr)>(0.337*h-0.81*c)*b*h*fbc*1000; if(sec) type='SEC (As=Amin)';
      if (!sec && mu>0 && mu<=0.392) { var beta=betaFromMu(mu); As=Math.max(0, Mr/(beta*d*sig*1000)*10000 - Nu/(sig*1000)*10000); }
    } else {
      if (Math.abs(eu)<=halfHc) {
        type='SET';

    }

  },
  result: function(r) {

  },
  diagram: function(r) {
    if (r.err) return '';
    return drawSection(r.b, r.h, r.type, [{x:r.c,y:r.c},{x:r.b-r.c,y:r.c},{x:r.c,y:r.h-r.c},{x:r.b-r.c,y:r.h-r.c}]);
  },
  diagCap: 'Section + aciers d\'angle',
  academic: String.raw`<h4>Flexion composée — Classement</h4>
<p>$e_u = M_u/N_u$ — excentricité = position du centre de pression.</p>

<h4>Effort normal réduit ν</h4>
<p><strong>RPA 99/2003 §7.4.3.1</strong> : $\nu \leq 0.30$ (valeur à confirmer dans le DTR).</p>
<p><strong>RPA 2024 §7.4</strong> : limites différenciées par ductilité — DCM $0.45$, DCH $0.35$.</p>
<p>Cette vérification évite la <em>rupture fragile</em> du béton comprimé avant plastification des aciers tendus.</p>
<div class="ref">Réf. BAEL91 + RPA99 §7.4.3.1 + RPA 2024 §7.4.</div>`
});

/* ========== FLÈCHE ========== */
reg({
  id: 'fleche', cat: 'Phase 2', icon: '📏',
  title: 'Flèche poutre',
  subtitle: 'BAEL B.6.5.2 — inertie fissurée',
  eq: [String.raw`f = \frac{M_s \cdot L^{2}}{10 \cdot I_{fv} \cdot E_v} \leq \frac{L}{500} \quad ; \quad I_{fv} = \frac{1.1\,I_0}{1+\mu\,\lambda}`],
  inputs: [
    {id:'fl_L', label:'$L$ (m)', v:4.75, s:0.05},
    {id:'fl_b0', label:'$b_0$ (cm)', v:25, s:1},
    {id:'fl_b', label:'$b$ table (cm)', v:65, s:1},
    {id:'fl_h', label:'$h$ (cm)', v:35, s:1},
    {id:'fl_h0', label:'$h_0$ table', v:4, s:1},
    {id:'fl_d', label:'$d$ (cm)', v:32, s:1},
    {id:'fl_As', label:'$A_{st}$ (cm²)', v:9.42, s:0.1},
    {id:'fl_Ms', label:'$M_s$ (kN·m)', v:60, s:1},
    {id:'fl_fc28', label:'$f_{c28}$', v:25, s:1}
  ],
  calc: function() {
    var L=nv('fl_L',4.75), b0=nv('fl_b0',25)/100, b=nv('fl_b',65)/100, h=nv('fl_h',35)/100;
    var h0=nv('fl_h0',4)/100, d=nv('fl_d',32)/100, As=nv('fl_As',9.42)/10000, Ms=nv('fl_Ms',60), fc=nv('fl_fc28',25);
    if (L<=0||b0<=0) return {err:true};
    var n=15, Ev=3700*Math.cbrt(fc)*1000;
    var B0=b0*h+(b-b0)*h0+n*As, Sx=b0*h*h/2+(b-b0)*h0*h0/2+n*As*d;
    var v1=Sx/B0, v2=h-v1;
    var I0=b0/3*(Math.pow(v1,3)+Math.pow(v2,3))+(b-b0)*h0*(h0*h0/12+Math.pow(v1-h0/2,2))+n*As*Math.pow(v2-0.03,2);
    var rho=As/(b0*d), ft=0.6+0.06*fc;
    var lam=0.05*ft/((2+3*b0/b)*rho), sigS=Ms/(As*0.9*d)/1000, mu=Math.max(1-(1.75*ft)/(4*rho*sigS+ft),0);
    var Ifv=1.1*I0/(1+mu*lam*0.4), f=(Ms*L*L)/(10*Ifv*Ev), fLim=L/500;
    return {f:f*1000, fLim:fLim*1000, Ifv:Ifv*1e8, I0:I0*1e8, rho:rho};
  },
  result: function(r) {
    if (r.err) return '<em style="color:var(--err)">Données invalides</em>';
    return sec('Inerties') +
      rr('$I_0$', fmt(r.I0,0)+' cm⁴') +
      rr('$I_{fv}$', fmt(r.Ifv,0)+' cm⁴') +
      rr('$\\rho$', fmt(r.rho,4)) +
      sec('Flèche') +
      rr('$f_{calc}$', fmt(r.f,2)+' mm') +
      rr('$f_{lim}$', fmt(r.fLim,2)+' mm') +
      '<div style="margin-top:8px">'+chk(r.f<=r.fLim, 'Flèche OK', 'Flèche excessive')+'</div>';
  },
  diagram: function(r) { return r.err ? '' : drawDeflection(r.f/1000, r.fLim/1000); },
  diagCap: 'Déformée',
  academic: String.raw`<h4>Flèche à long terme — BAEL B.6.5.2</h4>
<p>La flèche est calculée en tenant compte :</p>
<p>· de l'<strong>inertie fissurée</strong> $I_{fv}$ (déformation partiellement plastifiée)</p>
<p>· du <strong>module différé</strong> $E_v = 3700\,\sqrt[3]{f_{c28}}$ (fluage)</p>
<p>$$f = \frac{M_s \cdot L^{2}}{10 \cdot I_{fv} \cdot E_v} \leq \frac{L}{500}$$</p>
<p><strong>Calcul de $I_{fv}$</strong> : $I_{fv} = 1.1\,I_0/(1+\mu\,\lambda)$ avec $\mu$ et $\lambda$ dépendant de $\rho = A_s/(b_0 d)$ et $f_{t28}$.</p>
<div class="ref">Réf. BAEL91 — Art. B.6.5.2.</div>`
});

reg({

  title: 'Semelle isolée',
  subtitle: 'Dimensions + contraintes',

    if (Ns<=0||ss<=0) return {err:true};

    var e=Ms/Ns, qmin=Ns/A/A*(1-6*e/A), qmax=Ns/A/A*(1+6*e/A);

    return sec('Dimensions') +
      rr('$S_{\\min}$', fmt(r.Smin,3)+' m²') +
      rr('$A = B$', fmt(r.A*100,0)+' cm') +
      rr('$h$', r.h+' cm') +
      sec('Contraintes (kPa)') +
      rr('$e$', fmt(r.e,2)+' cm') +
      rr('$q_{\\min}$', fmt(r.qmin,1)) +

      rr('$\\sigma_{sol}$', fmt(r.ss,0)) +

  diagCap: 'Plan + élévation',
  academic: String.raw`<h4>Semelle isolée — DTR BC 2.2 + BAEL</h4>
<p><strong>Dimensionnement en plan</strong> : $S \geq N_s/\sigma_{sol}$ (ELS). Semelle homothétique : $A = \sqrt{S}$.</p>
<p><strong>Contraintes sous semelle</strong> : distribution trapézoïdale due à l'excentricité $e = M/N$ :</p>
<p>$$q_{\min}^{\max} = \frac{N_s}{S}\left(1 \pm \frac{6\,e}{A}\right)$$</p>
<p><strong>Conditions</strong> :</p>
<p>· $q_{\min} \geq 0$ (entièrement comprimée)</p>
<p>· $q_{\max} \leq 1.33\,\sigma_{sol}$ (bord admissible)</p>
<p>· $e \leq A/6$ (distribution trapézoïdale)</p>
<div class="ref">Réf. DTR BC 2.2 — fondations superficielles.</div>`
});

reg({
  id: 'voileper', cat: 'Phase 3', icon: '🌍',
  title: 'Voile périphérique',
  subtitle: 'Poussée Rankine',
  eq: [String.raw`K_a = \tan^{2}\!\left(\frac{\pi}{4} - \frac{\phi}{2}\right) \quad ; \quad \sigma_H(z) = K_a\left(\gamma\,z + q\right)`],
  inputs: [
    {id:'vp_g', label:'$\\gamma$ (kN/m³)', v:20.1, s:0.1},
    {id:'vp_phi', label:'$\\phi$ (°)', v:24, s:1},
    {id:'vp_H', label:'$H$ (m)', v:4.7, s:0.05},
    {id:'vp_q', label:'$q$ (kN/m²)', v:10, s:1},
    {id:'vp_e', label:'$e$ (cm)', v:25, s:1}
  ],
  calc: function() {
    var g=nv('vp_g',20.1), phi=nv('vp_phi',24), H=nv('vp_H',4.7), q=nv('vp_q',10), e=nv('vp_e',25);
    if (H<=0||phi<=0||phi>=90) return {err:true};
    var Ka=Math.pow(Math.tan(Math.PI/4 - phi*Math.PI/360), 2);
    var s1U=Ka*1.5*q, s2U=Ka*(1.35*g*H+1.5*q);
    var qu=(3*s2U+s1U)/4;
    return {Ka:Ka, s1U:s1U, s2U:s2U, qu:qu, g:g, H:H, q:q, e:e};
  },
  result: function(r) {
    if (r.err) return '<em style="color:var(--err)">φ ∈ ]0;90[ requis</em>';
    return sec('Coefficient') +
      rr('$K_a$', fmt(r.Ka,4)) +
      sec('Contraintes (kPa)') +
      rr('$\\sigma_{H1,u}$', fmt(r.s1U,2)) +
      rr('$\\sigma_{H2,u}$', fmt(r.s2U,2)) +
      sec('Pression équivalente') +
      rr('$q_u$', fmt(r.qu,2)+' kN/ml') +
      '<div style="margin-top:8px">'+infoB('Flexion composée + RPA §10.1')+'</div>';
  },
  diagram: function(r) { return r.err ? '' : drawWallPressure(r.Ka, r.g, r.H, r.q); },
  diagCap: 'Diagramme de poussée',
  academic: String.raw`<h4>Poussée des terres — Rankine</h4>
<p>Pour un sol pulvérulent ($c = 0$), état actif :</p>
<p>$$K_a = \tan^{2}\!\left(\frac{\pi}{4} - \frac{\phi}{2}\right)$$</p>
<p>$$\sigma_H(z) = K_a\left(\gamma\,z + q\right)$$</p>
<p>Distribution triangulaire (sol) + rectangulaire (surcharge).</p>
<p><strong>Application RPA §10.1</strong> : voile périphérique obligatoire pour ossatures au-dessous du niveau de base (vides sanitaires, sous-sol partiel).</p>
<p><strong>Ferraillage</strong> : 2 nappes, 0.10% min dans chaque sens, $e \geq 15$ cm.</p>
<div class="ref">Réf. Rankine + RPA §10.1.</div>`
});

/* ========== SPECTRE ========== */
reg({
  id: 'spectre', cat: 'Phase 4', icon: '🌐',
  title: 'Spectre RPA & V_base',
  subtitle: 'Action sismique — 2003 ou 2024',
  eq: [String.raw`\frac{S_{ad}(T)}{g} = A \cdot I \cdot S \cdot \begin{cases}
\frac{2}{3} + \frac{T}{T_B}\left(2.5\,\frac{Q_F}{R} - \frac{2}{3}\right) & 0 \leq T < T_B \\[6pt]
2.5\,\frac{Q_F}{R} & T_B \leq T < T_C \\[6pt]
2.5\,\frac{Q_F}{R} \cdot \frac{T_C}{T} & T_C \leq T < T_D \\[6pt]
2.5\,\frac{Q_F}{R} \cdot \frac{T_C\,T_D}{T^{2}} & T_D \leq T < 4\,\text{s}
\end{cases}`],
  inputs: [
    {id:'sp_R', label:'$R$ (comportement)', v:3.5, s:0.5},
    {id:'sp_Q', label:'$Q$ / $Q_F$', v:1.0, s:0.05},
    {id:'sp_W', label:'$W$ (kN)', v:46536, s:100},
    {id:'sp_T', label:'$T$ (s)', v:1.324, s:0.01},
    {id:'sp_xi', label:'$\\xi$ (%)', v:8.5, s:0.5},
    {id:'sp_n', label:'Niveaux', v:12, s:1}
  ],
  calc: function() {
    var g = readGlobals(), A = getZoneA(), S = getSite();
    var R=nv('sp_R',3.5), Q=nv('sp_Q',1.0), W=nv('sp_W',46536), T=nv('sp_T',1.324), xi=nv('sp_xi',8.5), n=nv('sp_n',12);
    if (T<=0||W<=0) return {err:true};
    var eta = Math.max(Math.sqrt(7/(2+xi/100)), 0.7);
    var curve=[], marks=[], minLine=0, SadAtT, V, ymax=0, i;
    if (g.code==='rpa2024') {
      var I=1.0, QF=Q, TB=S.TB, TC=S.TC, TD=S.TD;
      var sm = function(t){
        var v;
        if (t<=TB) v=(2/3)+(t/TB)*(2.5*QF/R-2/3);
        else if (t<=TC) v=2.5*QF/R;
        else if (t<=TD) v=(2.5*QF/R)*(TC/t);
        else v=(2.5*QF/R)*(TC*TD/(t*t));
        return Math.max(v*A*I*S.S, 0.2*A*I);
      };
      for (i=0; i<=100; i++) curve.push([i*4/100, sm(i*4/100)]);
      minLine = 0.2*A*I;
      marks = [{x:TB,lbl:'TB'},{x:TC,lbl:'TC'},{x:TD,lbl:'TD'}].filter(function(m){return m.x<=4;});
      SadAtT = sm(T);
      var lam = (T<=2*S.TC && n>2) ? 0.85 : 1.0;
      V = lam*SadAtT*W;
      curve.forEach(function(p){if(p[1]>ymax) ymax=p[1];});
      ymax *= 1.15;
      return {code:g.code, zone:g.zone, site:g.site, A:A, S:S.S, R:R, Q:QF, eta:eta, T:T, W:W, V:V, VW:V/W*100, SadAtT:SadAtT, curve:curve, marks:marks, minLine:minLine, ymax:ymax, lam:lam};
    } else {
      var sm2 = function(t){
        var d;
        if (t<=S.T2) d=2.5*eta;
        else if (t<=3) d=2.5*eta*Math.pow(S.T2/t,2/3);
        else d=2.5*eta*Math.pow(S.T2/t,2/3)*Math.pow(3/t,5/3);
        return A*d;
      };
      for (i=0; i<=100; i++) curve.push([i*4/100, sm2(i*4/100)]);
      marks = [{x:S.T1,lbl:'T1'},{x:S.T2,lbl:'T2'}].filter(function(m){return m.x<=4;});
      SadAtT = sm2(T);
      V = SadAtT*Q/R*W;
      curve.forEach(function(p){if(p[1]>ymax) ymax=p[1];});
      ymax *= 1.15;
      return {code:g.code, zone:g.zone, site:g.site, A:A, S:1, R:R, Q:Q, eta:eta, T:T, W:W, V:V, VW:V/W*100, SadAtT:SadAtT, curve:curve, marks:marks, minLine:0, ymax:ymax};
    }
  },
  result: function(r) {
    if (r.err) return '<em style="color:var(--err)">T et W doivent être positifs</em>';
    return sec('Paramètres') +
      rr('Code', r.code.toUpperCase()) +
      rr('Zone', r.zone) +
      rr('Site', r.site) +
      rr('$A$', r.A+' g') +
      rr('$S$', r.S) +
      rr('$R$', r.R) +
      rr(r.code==='rpa2024'?'$Q_F$':'$Q$', r.Q) +
      rr('$\\eta$', fmt(r.eta,3)) +
      sec('Effort tranchant') +
      rr('$S_{ad}/g\\,(T)$', fmt(r.SadAtT,4)) +
      rr('$V$', fmt(r.V,0)+' kN') +
      rr('$V/W$', fmt(r.VW,2)+' %') +
      '<div style="margin-top:8px">'+infoB('$V_{t,\\text{modal}} \\geq 0.8\\,V$')+'</div>';
  },
  diagram: function(r) { return r.err ? '' : drawSpectrum(r.curve, r.marks, r.minLine, r.ymax, 'Spectre'); },
  diagCap: 'Spectre de calcul',
  academic: String.raw`<h4>Spectre élastique RPA 2024</h4>
<p>$$\frac{S_{ad}(T)}{g} = A\,I\,S \cdot \begin{cases} \frac{2}{3}+\frac{T}{T_B}(2.5\frac{Q_F}{R}-\frac{2}{3}) & 0 \leq T < T_B \\ 2.5\frac{Q_F}{R} & T_B \leq T < T_C \\ 2.5\frac{Q_F}{R}\cdot\frac{T_C}{T} & T_C \leq T < T_D \\ 2.5\frac{Q_F}{R}\cdot\frac{T_C T_D}{T^2} & T_D \leq T < 4\,\text{s} \end{cases}$$</p>
<p><strong>Minimum réglementaire</strong> : $S_{ad}/g \geq 0.2\,A\,I$</p>
<h4>Spectre RPA 99/2003</h4>
<p>$$D(T) = \begin{cases} 2.5\,\eta & T \leq T_2 \\ 2.5\,\eta\left(\frac{T_2}{T}\right)^{2/3} & T_2 < T \leq 3\,\text{s} \\ 2.5\,\eta\left(\frac{T_2}{T}\right)^{2/3}\left(\frac{3}{T}\right)^{5/3} & T > 3\,\text{s} \end{cases}$$</p>
<p>$$V = \frac{A\,D\,Q}{R}\,W$$</p>
<p><strong>Différences 2003 → 2024</strong> : suppression du facteur $Q$ remplacé par $Q_F$ intégré; introduction de $T_B, T_C, T_D$ (au lieu de $T_1, T_2$).</p>
<div class="ref">Réf. RPA 99/2003 §4.2 + RPA 2024 §3.3.</div>`
});

/* ========== VÉRIFS SISMIQUES ========== */
reg({
  id: 'verifs', cat: 'Phase 4', icon: '🛡',
  title: 'Vérifs sismiques',
  subtitle: 'Joints · P-Δ · Déplacements',
  eq: [String.raw`d_{\min} = \max\left(\sqrt{\delta_1^{2} + \delta_2^{2}}\,;\,40\,\text{mm}\right) \quad ; \quad \theta_k = \frac{P_k \cdot \Delta_k}{V_k \cdot h_k} \leq 0.10 \quad ; \quad \nu_A\,\Delta_k \leq \overline{\Delta}_k`],
  inputs: [

  ],
  calc: function() {
    var d1=nv('vj_d1',45), d2=nv('vj_d2',35);

  result: function(r) {

      rr('$d_{\\min}$', fmt(r.dmin,1)+' mm') +
      sec('Effet P-Δ') +
      rr('$\\theta_k$', fmt(r.theta,4)) +
      sec('Déplacements BA') +

  diagram: function(r) {

    s += '<rect x="105" y="45" width="60" height="55" fill="'+C.conc+'" stroke="'+C.line+'" stroke-width="1.5"/>';
    s += '<text x="95" y="135" text-anchor="middle" font-size="10" fill="'+C.accent+'">Joints: '+r.dmin.toFixed(1)+'mm</text>';
    var pdX=200, col = r.theta<=0.10 ? C.ok : (r.theta<=0.20 ? '#d97706' : C.err);
    s += '<line x1="'+(pdX+30)+'" y1="30" x2="'+(pdX+30)+'" y2="100" stroke="'+C.muted+'" stroke-width="2" stroke-dasharray="3,3"/>';
    s += '<path d="M'+(pdX+30)+',30 Q'+(pdX+30)+',70 '+(pdX+30+Math.min(20, r.theta*200))+',100" fill="none" stroke="'+C.accent+'" stroke-width="2.5"/>';
    s += '<text x="'+(pdX+30)+'" y="125" text-anchor="middle" font-size="10" fill="'+col+'">P-Δ: '+r.theta.toFixed(3)+'</text>';
    var depX=20, depY=170;
    for (var i=0; i<4; i++) {

  },
  diagCap: 'Joints · P-Δ · Déplacements',
  academic: String.raw`<h4>1. Joints sismiques — RPA §5.9</h4>
<p>$$d_{\min} = \max\left(\sqrt{\delta_1^{2} + \delta_2^{2}}\,;\,40\,\text{mm}\right)$$</p>
<p>$\delta_1, \delta_2$ = déplacements max des deux blocs au sommet du bloc le moins élevé, incluant la torsion. Combinaison SRSS (Square Root of Sum of Squares) pour tenir compte de l'indépendance des mouvements.</p>
<h4>2. Effet P-Δ — RPA §5.10</h4>
<p>$$\theta_k = \frac{P_k \cdot \Delta_k}{V_k \cdot h_k}$$</p>
<p>· $\theta_k \leq 0.10$ : négligeable ✓</p>
<p>· $0.10 < \theta_k \leq 0.20$ : amplifier par $1/(1-\theta_k)$</p>
<p>· $\theta_k > 0.20$ : structure instable — redimensionner</p>
<h4>3. Déplacements inter-étages — RPA §5.10</h4>
<p>$$\nu_A\,\Delta_k \leq \overline{\Delta}_k \quad ; \quad \nu_A = 0.50$$</p>
<p>$\overline{\Delta}_k$ : Acier $0.010\,h_k$ · BA $0.0075\,h_k$ · PAF $0.0050\,h_k$ · Bois $0.0075\,h_k$ · Maçonnerie $0.0050\,h_k$</p>
<div class="ref">Réf. RPA99 §5.8-5.10 + RPA 2024 §5.9-5.11.</div>`
});

/* ========== LIQUÉFACTION ========== */
reg({
  id: 'liquef', cat: 'Phase 4', icon: '🌊',
  title: 'Liquéfaction',
  subtitle: 'Seed-Idriss — facteur de sécurité SPT',
  eq: [String.raw`FS = \frac{CRR_{7.5}}{CSR} \cdot MSF \quad ; \quad MSF = \left(\frac{M_w}{7.5}\right)^{-2.56}`,
       String.raw`CSR = 0.65\,(A\,I\,S)\cdot\frac{\sigma_0}{\sigma'_0}\cdot r_d`,
       String.raw`CRR_{7.5} = \frac{1}{34 - (N_1)_{60cs}} + \frac{(N_1)_{60cs}}{135} + \frac{50}{\left[10\,(N_1)_{60cs} + 45\right]^{2}} - \frac{1}{200}`],
  inputs: [
    {id:'lq_z', label:'$z$ (m)', v:6, s:0.5},
    {id:'lq_N', label:'$N_{SPT}$', v:15, s:1},
    {id:'lq_FC', label:'Fines FC (%)', v:20, s:5},
    {id:'lq_Mw', label:'$M_w$', v:7.0, s:0.1},
    {id:'lq_wt', label:'Nappe (m)', v:3, s:0.5},
    {id:'lq_g', label:'$\\gamma$ (kN/m³)', v:18, s:0.5}
  ],
  calc: function() {
    var g = readGlobals();
    var z=nv('lq_z',6), N=nv('lq_N',15), FC=nv('lq_FC',20), Mw=nv('lq_Mw',7.0), wt=nv('lq_wt',3), gs=nv('lq_g',18);
    if (z<=0) return {err:true};
    var A=getZoneA(), S=getSite().S, I=1.0, gw=9.81;
    var sigma0=gs*z, sigma0p = z<=wt ? sigma0 : gs*wt+(gs-gw)*(z-wt);
    var rd = z<=9.15 ? 1-0.00765*z : Math.max(0,1.174-0.0267*z);
    var CSR = 0.65*(A*I*S)*(sigma0/sigma0p)*rd;
    var CN = Math.min(1.7, Math.sqrt(100/sigma0p));
    var N1_60 = N*CN;
    var N1_60cs = FC<=5 ? N1_60 : (FC<35 ? N1_60+(FC-5)/2 : N1_60+15);
    var CRR = N1_60cs<30 ? 1/(34-N1_60cs)+N1_60cs/135+50/Math.pow(10*N1_60cs+45,2)-1/200 : 2.0;
    var MSF = Math.pow(Mw/7.5,-2.56);
    var FS = (CRR/CSR)*MSF;
    return {z:z, wt:wt, FS:FS, CSR:CSR, CRR:CRR, MSF:MSF, N1_60cs:N1_60cs};
  },
  result: function(r) {
    if (r.err) return '<em style="color:var(--err)">$z > 0$ requis</em>';
    var cls = r.FS>=1.25?'ok':(r.FS>=1.0?'warn':'bad');
    var msg = r.FS>=1.25?'Sol non liquéfiable':(r.FS>=1.0?'Risque marginal':'Liquéfaction probable');
    return sec('Contraintes') +
      rr('$CSR$', fmt(r.CSR,4)) +
      rr('$(N_1)_{60cs}$', fmt(r.N1_60cs,2)) +
      rr('$CRR_{7.5}$', fmt(r.CRR,4)) +
      rr('$MSF$', fmt(r.MSF,3)) +
      rr('$FS$', fmt(r.FS,3)) +
      '<div style="margin-top:8px"><span class="badge '+cls+'">'+msg+'</span></div>';
  },
  diagram: function(r) { return r.err ? '' : drawSoilProfile(r.z, r.wt, r.FS); },
  diagCap: 'Coupe sol + FS',
  academic: String.raw`<h4>Évaluation de la liquéfaction</h4>
<p><strong>CSR</strong> (Cyclic Stress Ratio) :</p>
<p>$$CSR = 0.65\,(A\,I\,S)\cdot\frac{\sigma_0}{\sigma'_0}\cdot r_d$$</p>
<p><strong>CRR</strong> (Cyclic Resistance Ratio) :</p>
<p>$$CRR_{7.5} = \frac{1}{34-(N_1)_{60cs}} + \frac{(N_1)_{60cs}}{135} + \frac{50}{[10(N_1)_{60cs}+45]^2} - \frac{1}{200}$$</p>
<p><strong>MSF</strong> = $(M_w/7.5)^{-2.56}$</p>
<p><strong>FS</strong> = $(CRR/CSR) \cdot MSF$</p>
<p><strong>Interprétation</strong> : $FS \geq 1.25$ non liquéfiable · $FS < 1.0$ liquéfaction probable</p>
<div class="ref">Réf. Seed & Idriss (1971) modifié Youd et al. (2001) — RPA 2024 §10.2.</div>`
});

function genCombos() {
  var n=nv('et_n',12), Gp=nv('et_Gp',5.42), Qp=nv('et_Qp',1.5), Gt=nv('et_Gt',5.61), Qt=nv('et_Qt',1.0), S=nv('et_S',25);
  var psi = [];
  for (var i=1; i<=n; i++) psi.push(i===1?1.0:i===2?0.9:i<=5?0.8:i<=10?0.7:0.6);
  var txt = '=============================================\n';
  txt += 'ETABS LOAD COMBINATIONS — DTR BC 2.2\n';
  txt += 'Project: R+'+n+' · '+readGlobals().code.toUpperCase()+'\n';
  txt += 'Date: '+new Date().toLocaleDateString('fr-FR')+'\n';
  txt += '=============================================\n\n';
  txt += '--- BASIC PATTERNS ---\n';
  txt += 'DL : Dead Load\nLL : Live Load\nEQX: Earthquake X\nEQY: Earthquake Y\n\n';
  txt += '--- ELU ---\n';
  txt += 'COMB1: 1.35*DL + 1.5*LL\n';
  txt += 'COMB2: 1.35*DL + 1.5*LL + 1.0*EQX\n';
  txt += 'COMB3: 1.35*DL + 1.5*LL - 1.0*EQX\n';
  txt += 'COMB4: 1.35*DL + 1.5*LL + 1.0*EQY\n';
  txt += 'COMB5: 1.35*DL + 1.5*LL - 1.0*EQY\n';
  txt += 'COMB6: 0.9*DL + 1.0*EQX\n';
  txt += 'COMB7: 0.9*DL + 1.0*EQY\n\n';
  txt += '--- ELS ---\n';
  txt += 'ELS1: DL + LL\nELS2: DL + LL + EQX\nELS3: DL + LL + EQY\n\n';
  txt += '--- ACCIDENTAL ---\n';
  txt += 'ACC1: G + Q + 1.0*EQX\nACC2: G + Q + 1.0*EQY\n\n';
  txt += '--- LOAD DESCENT (S='+S+' m2) ---\n';
  var cG=0, cQ=0;
  for (var j=0; j<n; j++) {
    cG += Gp*S; cQ += Qp*S*psi[j];
    txt += 'Niveau '+(j+1)+': G='+cG.toFixed(1)+' kN, Q='+cQ.toFixed(1)+' kN, Ns='+(cG+cQ).toFixed(1)+' kN\n';
  }
  cG += Gt*S; cQ += Qt*S;
  txt += 'Terrasse: G='+cG.toFixed(1)+' kN, Q='+cQ.toFixed(1)+' kN\n';
  var el = $('combos-output');
  if (el) el.textContent = txt;
}

function genSeismic() {
  var A=nv('et_A',0.20), R=nv('et_R',3.5), T=nv('et_T',1.2), W=nv('et_W',25000), I=nv('et_I',1.0), eta=nv('et_eta',1.0);
  var g = readGlobals();
  var Tg = g.site==='S1'?0.10 : g.site==='S2'?0.20 : g.site==='S3'?0.30 : 0.40;
  var Ts = g.site==='S1'?0.40 : g.site==='S2'?0.60 : g.site==='S3'?0.80 : 1.20;
  var D;
  if (T<=Tg) D = 1+(eta-1)*(T/Tg);
  else if (T<=Ts) D = eta;
  else if (T<=3) D = eta*Math.pow(Ts/T,2/3);
  else D = eta*Math.pow(Ts/T,2/3)*Math.pow(3/T,5/3);
  var V = (A*I*D*W)/R;
  var txt = '=============================================\n';
  txt += 'ETABS SEISMIC PARAMETERS\n';
  txt += 'Code: '+g.code.toUpperCase()+' · Zone '+g.zone+' · Site '+g.site+'\n';
  txt += '=============================================\n\n';
  txt += 'A (zone): '+A+'\n';
  txt += 'I (importance): '+I+'\n';
  txt += 'R (behavior): '+R+'\n';
  txt += 'eta: '+eta+'\n\n';
  txt += 'Tg: '+Tg+' s\nTs: '+Ts+' s\n\n';
  txt += '--- DYNAMIC ANALYSIS ---\n';
  txt += 'T: '+T+' s\nD(T): '+D.toFixed(3)+'\nW: '+W+' kN\nV: '+V.toFixed(1)+' kN\nV/W: '+(V/W*100).toFixed(2)+' %\n\n';
  txt += '--- ETABS LOAD PATTERN ---\n';
  txt += 'EQX: QUAK, Direction=X, Eccentricity=0.05\n';
  txt += 'Base Shear Coef: '+(A*I*D/R).toFixed(4)+'\n\n';
  txt += 'EQY: QUAK, Direction=Y, Eccentricity=0.05\n';
  txt += 'Base Shear Coef: '+(A*I*D/R).toFixed(4)+'\n';
  var el = $('seismic-output');
  if (el) el.textContent = txt;
}

function genSection() {
  var type = (($('et_type')||{}).value) || 'poteau';
  var name = (($('et_name')||{}).value) || 'SECTION';
  var b = nv('et_b',40), h = nv('et_h',40);
  var A = b*h, I = b*Math.pow(h,3)/12, W = b*h*h/6, r = Math.sqrt(I/A);
  var txt = 'ETABS SECTION: '+name+'\n';
  txt += 'Type: '+type.toUpperCase()+'\n';
  txt += 'b='+b+' cm, h='+h+' cm\n\n';
  txt += 'Area: '+A.toFixed(1)+' cm²\n';
  txt += 'I: '+I.toFixed(0)+' cm⁴\n';
  txt += 'W: '+W.toFixed(0)+' cm³\n';
  txt += 'r: '+r.toFixed(2)+' cm\n\n';
  txt += '--- RPA 2024 CHECKS ---\n';
  if (type==='poteau') {
    txt += 'Min dimension: '+Math.min(b,h)+' ≥ 30 cm: '+(Math.min(b,h)>=30?'OK':'FAIL')+'\n';
    txt += 'b/h ≤ 4: '+(Math.max(b,h)/Math.min(b,h)<=4?'OK':'FAIL')+'\n';
    txt += 'Min reinf 0.9%: '+(0.009*A).toFixed(2)+' cm²\n';
  } else if (type==='poutre') {
    txt += 'b ≥ 20: '+(b>=20?'OK':'FAIL')+'\n';
    txt += 'h ≥ 30: '+(h>=30?'OK':'FAIL')+'\n';
    txt += 'h/b ≤ 4: '+(h/b<=4?'OK':'FAIL')+'\n';
  } else {
    txt += 'Min thickness ≥ 15: '+(Math.min(b,h)>=15?'OK':'FAIL')+'\n';
  }
  var el = $('sections-output');
  if (el) el.textContent = txt;
}

function exportTXT(id, filename) {
  var el = $(id);
  if (!el) return;
  var blob = new Blob([el.textContent], {type:'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename+'_'+Date.now()+'.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function buildModel() {
  var n = Math.max(1, Math.round(nv('md_n', 13))), h = nv('md_h', 3.06), nx = Math.max(1, Math.round(nv('md_nx', 4))), ny = Math.max(1, Math.round(nv('md_ny', 3)));
  var lx = nv('md_lx', 4.5), ly = nv('md_ly', 4.5), cs = [nv('md_c1', 60), nv('md_c2', 50), nv('md_c3', 40)];
  var bb = nv('md_bb', 30), bh = nv('md_bh', 45), sl = nv('md_sl', 16), wt = nv('md_wt', 20);
  var M = { n:n, h:h, nx:nx, ny:ny, lx:lx, ly:ly, Lx:nx * lx, Ly:ny * ly, H:n * h, cols:[], beams:[], slabs:[], walls:[], bb:bb, bh:bh, sl:sl, cs:cs };
  var i, j, k;
  for (k = 0; k < n; k++) {
    var grp = k < n / 3 ? 0 : (k < 2 * n / 3 ? 1 : 2), a = cs[grp];
    for (i = 0; i <= nx; i++) for (j = 0; j <= ny; j++) M.cols.push({ x:i * lx, y:j * ly, z0:k * h, z1:(k + 1) * h, b:a, h:a, s:k, g:grp });
    var z = (k + 1) * h;
    for (j = 0; j <= ny; j++) for (i = 0; i < nx; i++) M.beams.push({ x1:i * lx, y1:j * ly, x2:(i + 1) * lx, y2:j * ly, z:z, b:bb, h:bh, dir:'X', s:k });
    for (i = 0; i <= nx; i++) for (j = 0; j < ny; j++) M.beams.push({ x1:i * lx, y1:j * ly, x2:i * lx, y2:(j + 1) * ly, z:z, b:bb, h:bh, dir:'Y', s:k });
    for (i = 0; i < nx; i++) for (j = 0; j < ny; j++) M.slabs.push({ x0:i * lx, y0:j * ly, x1:(i + 1) * lx, y1:(j + 1) * ly, z:z, t:sl, s:k });
    var nw = Math.min(2, Math.max(0, Math.round(nv('md_nw', 1))));
    for (var q = 0; q < nw; q++) {
      var z0 = k * h, z1 = (k + 1) * h;
      M.walls.push({ x1:q * lx, y1:0, x2:(q + 1) * lx, y2:0, z0:z0, z1:z1, t:wt, kind:'voile', s:k });
      M.walls.push({ x1:(nx - 1 - q) * lx, y1:M.Ly, x2:(nx - q) * lx, y2:M.Ly, z0:z0, z1:z1, t:wt, kind:'voile', s:k });
      M.walls.push({ x1:0, y1:q * ly, x2:0, y2:(q + 1) * ly, z0:z0, z1:z1, t:wt, kind:'voile', s:k });
      M.walls.push({ x1:M.Lx, y1:(ny - 1 - q) * ly, x2:M.Lx, y2:(ny - q) * ly, z0:z0, z1:z1, t:wt, kind:'voile', s:k });
    }
    if (nv('md_core', 1) >= 1) {
      var cw = nv('md_cw', 2.4), cd = nv('md_cd', 2.6), cx = Math.floor(nx / 2) * lx + (lx - cw) / 2, cy = Math.floor(ny / 2) * ly + (ly - cd) / 2;
      [[cx, cy, cx + cw, cy], [cx, cy + cd, cx + cw, cy + cd], [cx, cy, cx, cy + cd], [cx + cw, cy, cx + cw, cy + cd]].forEach(function (w) { M.walls.push({ x1:w[0], y1:w[1], x2:w[2], y2:w[3], z0:k * h, z1:(k + 1) * h, t:wt, kind:'noyau', s:k }); });
    }
  }
  return M;
}

/* ===== P3: spectrum helper, modal spectral analysis, pushover ===== */
"use strict";
var GRAV = 9.81;

/* Sa/g design (reduced by R) for current code/zone/site. xi in %. */
function spectrumSa(T, R, Q, xi) {
  var g = readGlobals(), A = getZoneA(), S = getSite(), eta = Math.max(Math.sqrt(7 / (2 + (xi === undefined ? 5 : xi))), 0.7);
  if (g.code === 'rpa2024') {
    var TB = S.TB, TC = S.TC, TD = S.TD, f = 2.5 * Q / R, v;
    if (T <= TB) v = 2 / 3 + (T / TB) * (f - 2 / 3); else if (T <= TC) v = f; else if (T <= TD) v = f * TC / T; else v = f * TC * TD / (T * T);
    return Math.max(v * A * S.S, 0.2 * A);
  }
  var T1 = S.T1, T2 = S.T2, q = Q / R, a = 1.25 * A;
  if (T <= T1) return a * (1 + T / T1 * (2.5 * eta * q - 1));
  if (T <= T2) return 2.5 * eta * a * q;
  if (T <= 3) return 2.5 * eta * a * q * Math.pow(T2 / T, 2 / 3);
  return 2.5 * eta * a * q * Math.pow(T2 / 3, 2 / 3) * Math.pow(3 / T, 5 / 3);
}
/* static-method V/W coefficient: RPA99 V=A*D*Q/R (no 1.25 factor); RPA2024 uses same spectrum as dynamic */
function staticCoef(T, R, Q, xi) {
  var g = readGlobals(); if (g.code === 'rpa2024') return spectrumSa(T, R, Q, xi);
  var A = getZoneA(), S = getSite(), eta = Math.max(Math.sqrt(7 / (2 + xi)), 0.7), D;
  if (T <= S.T2) D = 2.5 * eta; else if (T <= 3) D = 2.5 * eta * Math.pow(S.T2 / T, 2 / 3); else D = 2.5 * eta * Math.pow(S.T2 / 3, 2 / 3) * Math.pow(3 / T, 5 / 3);
  return A * D * Q / R;
}
function siteTc() { var g = readGlobals(), S = getSite(); return g.code === 'rpa2024' ? S.TC : S.T2; }

function jacobiEig(Ain) {
  var n = Ain.length, A = Ain.map(function (r) { return r.slice(); }), V = [], i, j, k, p, q;
  for (i = 0; i < n; i++) { V.push(new Array(n).fill(0)); V[i][i] = 1; }
  for (var sweep = 0; sweep < 100; sweep++) {
    var off = 0; for (i = 0; i < n; i++) for (j = i + 1; j < n; j++) off += A[i][j] * A[i][j];
    if (off < 1e-18) break;
    for (p = 0; p < n - 1; p++) for (q = p + 1; q < n; q++) {
      if (Math.abs(A[p][q]) < 1e-30) continue;
      var th = (A[q][q] - A[p][p]) / (2 * A[p][q]), t_ = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1)), c = 1 / Math.sqrt(t_ * t_ + 1), s = t_ * c;
      for (k = 0; k < n; k++) { var akp = A[k][p], akq = A[k][q]; A[k][p] = c * akp - s * akq; A[k][q] = s * akp + c * akq; }
      for (k = 0; k < n; k++) { var apk = A[p][k], aqk = A[q][k]; A[p][k] = c * apk - s * aqk; A[q][k] = s * apk + c * aqk; }
      for (k = 0; k < n; k++) { var vkp = V[k][p], vkq = V[k][q]; V[k][p] = c * vkp - s * vkq; V[k][q] = s * vkp + c * vkq; }
    }
  }
  var vals = [], vecs = [], idx = []; for (i = 0; i < n; i++) idx.push(i);
  idx.sort(function (a, b) { return A[a][a] - A[b][b]; });
  idx.forEach(function (ii) { vals.push(A[ii][ii]); var v = []; for (k = 0; k < n; k++) v.push(V[k][ii]); vecs.push(v); });
  return { vals:vals, vecs:vecs };
}

/* shear-building data from modal inputs */
function storeyModel() {
  var n = Math.max(2, Math.min(40, Math.round(nv('mo_n', 12)))), h = nv('mo_h', 3.06), W = nv('mo_W', 46536), nc = nv('mo_nc', 30), fc = nv('mo_fc', 25), crack = nv('mo_cr', 0.5), wf = nv('mo_wf', 1.0);
  var cs = [nv('mo_c1', 60), nv('mo_c2', 50), nv('mo_c3', 40)], E = 11000 * Math.cbrt(fc) * 1000, m = [], k = [];
  for (var i = 0; i < n; i++) {
    m.push(W / n / GRAV);
    var grp = i < n / 3 ? 0 : (i < 2 * n / 3 ? 1 : 2), a = cs[grp] / 100, I = Math.pow(a, 4) / 12;
    var bb_ = nv('md_bb', 30) / 100, bh_ = nv('md_bh', 45) / 100, Lb = Math.max(nv('md_lx', 4.5), 1), Ib = bb_ * Math.pow(bh_, 3) / 12,
        aMuto = 2 * (Ib / Lb) / (I / h), fac = aMuto / (2 + aMuto);          // Muto: beam flexibility lowers column storey stiffness
